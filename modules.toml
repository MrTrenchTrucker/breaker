# modules.toml — machine-checkable module registry
# One entry per module and sub-module at every depth. The tree must match this
# exactly; tools/check_repo.py validates it.

[module.android]
path = "android"
owns = "The phone client: Kotlin/native Android app shell, DI wiring, screens."
does_not_own = "Server-side logic (server/*); shared contracts (shared/*)."
depends_on = ["shared"]
public = "App entry, Gradle build, app-level wiring"
card = "android/AGENTS.md"

[module.android_app]
path = "android/app"
owns = "Android entry point, dependency injection wiring, Gradle build."
does_not_own = "Screen implementations (ui); domain logic (core)."
depends_on = ["android", "android_core", "android_ui", "android_settings", "android_history", "android_audio", "android_format", "android_transport", "android_overlay", "android_stt_ondevice", "android_stt_server", "shared_ui_tokens", "shared_model_registry", "android_commit", "android_commit_accessibility", "android_gesture", "android_crypto", "android_auth_client", "android_http", "android_sync", "shared_api_contracts"]
public = "App entry, DI container"
card = "android/app/AGENTS.md"

[module.android_ui]
path = "android/ui"
owns = "Screens: home, history, settings, how it works, about, auth, sign-in start, and the first-run flow for the permissions (accessibility service, overlay). Consumes ui-tokens."
does_not_own = "Business logic (core); platform adapters (modules/*)."
depends_on = ["android", "android_core", "shared_ui_tokens"]
public = "createSettingsView, createFirstRunView, createHistoryView, BreakerSwitch, createHomeView, HomeControl, createHowItWorksView, createAboutView, DownloadControl, ModelStepControl, createSignInStartView, SignInStartControl, createAuthView, AuthControl"
card = "android/ui/AGENTS.md"

[module.android_core]
path = "android/modules/core"
owns = "Domain models, ports, use cases. No Android imports."
does_not_own = "Android platform code; adapters."
depends_on = ["android"]
public = "Domain models (including HeardWord, WordUpdate, SignInAttempt, SignInLinkResult, SignInLinkRefusal, HandoffReturn, StoredAccountKeys), ports (including KeyDerivation, WordStream, SignInStarter, HandoffReceiver, HandoffReceipt, DefaultHandoffReceiver, CredentialVault, PullSink), use cases (including SignInHolder, HandoffOutcome)"
card = "android/modules/core/AGENTS.md"

[module.android_audio]
path = "android/modules/audio"
owns = "Mic capture, VAD, noise suppression, WAV encode (16 kHz mono PCM)."
does_not_own = "Transcription (stt-*); phrase matching (phrases)."
depends_on = ["android", "android_core"]
public = "MicCapture, Pcm16WavEncoder, MicSource, MicSourceException, NoiseSuppressor, PassThroughNoiseSuppressor, AdaptiveGateSuppressor, RecordingIndicator, AndroidMicSource, MicReleaseWatcher"
card = "android/modules/audio/AGENTS.md"

[module.android_stt_ondevice]
path = "android/modules/stt-ondevice"
owns = "sherpa-onnx local transcription (fallback engine), model lifecycle, checksum verify."
does_not_own = "Server transcription (stt-server); model catalog (shared/model-registry)."
depends_on = ["android", "android_core", "shared_model_registry"]
public = "OnDeviceSttEngine (implements core SttEngine), ModelLoader, ModelInstaller, LocalModelStore, ModelFetcher, HttpModelFetcher, SherpaRecognizerFactory, SherpaOnnxRecognizerFactory, SherpaOnnxWordStreamFactory (word stream), FedWordStream (fed word stream)"
card = "android/modules/stt-ondevice/AGENTS.md"

[module.android_stt_server]
path = "android/modules/stt-server"
owns = "Client for Breaker's own whisper-server job queue (primary path)."
does_not_own = "Local transcription (stt-ondevice); queue (server/whisper-server)."
depends_on = ["android", "android_core", "shared_api_contracts"]
public = "SttEngine (server path), ServerTarget"
card = "android/modules/stt-server/AGENTS.md"

[module.android_transport]
path = "android/modules/transport"
owns = "Whether the Local Server is reachable (TCP connect, 1.5 s timeout, 30 s TTL cache); it probes only the configured Local Server, so there is no cloud path to fall through to."
does_not_own = "The engines themselves (stt-*); sync (sync); routing between engines (core.DictateUseCase)."
depends_on = ["android", "android_core"]
public = "TcpConnectivityProbe"
card = "android/modules/transport/AGENTS.md"

[module.android_format]
path = "android/modules/format"
owns = "Whisper Flow-style formatting: server LLM + rule-based local formatter."
does_not_own = "The LLM itself (server); prompts live in shared/format-prompts."
depends_on = ["android", "android_core", "shared_format_prompts", "android_http"]
public = "Formatter"
card = "android/modules/format/AGENTS.md"

[module.android_phrases]
path = "android/modules/phrases"
owns = "Voice phrases: 'Breaker Breaker' wake + 'And I'm Gone' send detection, reporting where the send phrase began."
does_not_own = "Gesture (gesture); overlay (overlay); training (training-client)."
depends_on = ["android", "android_core"]
public = "PhraseDetector"
card = "android/modules/phrases/AGENTS.md"

[module.android_gesture]
path = "android/modules/gesture"
owns = "Shake-to-wake (accelerometer)."
does_not_own = "Voice wake (phrases); tile (overlay)."
depends_on = ["android", "android_core"]
public = "ShakeHandle, ShakePort, SensorManagerShakeSource"
card = "android/modules/gesture/AGENTS.md"

[module.android_overlay]
path = "android/modules/overlay"
owns = "Floating tile = CB mic glyph + LED bar meter (WindowManager overlay, F36); ScreenMic = the same mic for an app screen, with no window, no drag and no notice strip (F45, ADR-026)."
does_not_own = "Dictation itself: recording and putting the text into the target field (app, commit; ADR-022); gesture/voice triggers."
depends_on = ["android", "android_core", "shared_ui_tokens"]
public = "FloatingTile (via create), FloatingTile.setImeProbe, ShowResult, TileState, ScreenMic (via create), ScreenMicProbe"
card = "android/modules/overlay/AGENTS.md"

[module.android_commit]
path = "android/modules/commit"
owns = "CommitService: mechanism-neutral text commit (focused field gets the text, otherwise the clipboard) + toast."
does_not_own = "Formatting (format); history storage (history); the text-insert mechanism itself (commit/accessibility, commit/ime)."
depends_on = ["android", "android_core"]
public = "CommitService, CommitServices, FocusedField, FieldCommit, FocusedFieldHolder.publish, KeyboardProbeReadings (setEnabled/isEnabled/publish/current/recent), ProbeReading"
card = "android/modules/commit/AGENTS.md"

[module.android_commit_ime]
path = "android/modules/commit/ime"
owns = "Dead code: a keyboard (IME) adapter that published the focused field for the commit service, written for ADR-005. Superseded by ADR-022; kept out of the build on purpose. See DEAD_CODE.md."
does_not_own = "The live text-insert mechanism (commit/accessibility); the mechanism-neutral commit logic (commit)."
depends_on = ["android_commit"]
public = ""
card = "android/modules/commit/ime/AGENTS.md"
status = "dead"

[module.android_commit_accessibility]
path = "android/modules/commit/accessibility"
owns = "The accessibility text-insert mechanism (ADR-022): finds the focused editable field, inserts text (ACTION_SET_TEXT merging at the cursor; ACTION_PASTE is not built yet), refuses password fields, publishes the focused field into the parent's holder."
does_not_own = "The mechanism-neutral commit logic (commit); the dead keyboard adapter (commit/ime); the first-run flow for the permission (ui)."
depends_on = ["android_commit"]
public = "BreakerAccessibilityService"
card = "android/modules/commit/accessibility/AGENTS.md"

[module.android_history]
path = "android/modules/history"
owns = "SQLite transcription history, 3-month TTL cleanup, tombstones."
does_not_own = "Sync transport (sync); encryption (crypto)."
depends_on = ["android", "android_core"]
public = "SqliteHistoryStore (via create), PurgeReport"
card = "android/modules/history/AGENTS.md"

[module.android_settings]
path = "android/modules/settings"
owns = "Settings persistence + model registry access."
does_not_own = "Server URL auth (auth-client); model catalog (shared/model-registry)."
depends_on = ["android", "android_core", "shared_model_registry"]
public = "SettingsFileStore, Keystore, ModelCatalog, ModelInfo"
card = "android/modules/settings/AGENTS.md"

[module.android_sync]
path = "android/modules/sync"
owns = "Offline-first sync queue, idempotent push (F13, N12), and delivery of pending sealed agent-token results (ADR-018)."
does_not_own = "Encryption (crypto); auth (auth-client); history storage (history)."
depends_on = ["android", "android_core", "shared_api_contracts"]
public = "QueuedSyncService (via create), SyncUploader, UploadOutcome, PullTransport, PullTransportResult, PullRequest (path and query)"
card = "android/modules/sync/AGENTS.md"

[module.android_auth_client]
path = "android/modules/auth-client"
owns = "Login/register, token storage (Android Keystore), roles/scopes."
does_not_own = "Key derivation/crypto (crypto); server auth logic (server/sync-api)."
depends_on = ["android", "android_core", "shared_api_contracts"]
public = "AuthService, HandoffFinish"
card = "android/modules/auth-client/AGENTS.md"

[module.android_http]
path = "android/modules/http"
owns = "The one HTTP client for calls to the Local Server and the update host: GET and POST, request headers, a request body of known length, no redirects, no cache, https for any host and plain http only for the configured server (one address rule, ServerAddressRule), connect and read timeouts, a reply-size cap, and no logging of a header or a body."
does_not_own = "Call meaning and JSON (callers); the server address (settings, app); tokens and sessions (auth-client); retry and queueing (sync); pinning beyond the platform trust store; TLS and certificates (the admin's reverse proxy, ADR-034)."
depends_on = ["android", "android_core"]
public = "HttpTransport, JdkHttpTransport, ServerAddressRule, CallMethod, CallRequest, CallLimits, BytesReply, StreamReply, HttpRefusal, HttpRefusalReason"
card = "android/modules/http/AGENTS.md"

[module.android_training_client]
path = "android/modules/training-client"
owns = "Record phrase samples, upload, download trained model + checksum verify."
does_not_own = "Training itself (server/training); phrase detection (phrases)."
depends_on = ["android", "android_core"]
public = "None yet: no code. PhraseTraining is core's port that this module is to implement."
card = "android/modules/training-client/AGENTS.md"

[module.android_updater]
path = "android/modules/updater"
owns = "Daily update check + admin force-check, signed APK verify, rollback."
does_not_own = "Update endpoint (server/sync-api); APK signing (server/deploy)."
depends_on = ["android", "android_core", "shared_api_contracts"]
public = "UpdateChecker"
card = "android/modules/updater/AGENTS.md"

[module.android_crypto]
path = "android/modules/crypto"
owns = "Client-side key derivation (Argon2id + HKDF), DEK generation/wrap/unwrap, AES-256-GCM, X25519 box keypair generation, sealed-box unsealing (ADR-006, ADR-018)."
does_not_own = "Key wrapping of any kind server-side — the server never wraps or unwraps a key (server/sync-api); token storage (auth-client); sealing a job result to the owner's key, which happens server-side in whisper-server (ADR-018)."
depends_on = ["android", "android_core"]
public = "CryptoService, CryptoServiceImpl, KdfImpl, SignInStarterImpl"
card = "android/modules/crypto/AGENTS.md"

[module.server]
path = "server"
owns = "Local Server services: transcription, sync, web, training, deploy."
does_not_own = "Phone client (android/*); shared contracts (shared/*)."
depends_on = ["shared"]
public = "Server entry, container wiring"
card = "server/AGENTS.md"

[module.server_whisper]
path = "server/modules/whisper-server"
owns = "/v1/audio/transcriptions + FIFO queue worker + job API, forwarding to the admin-configured service. (Phase 19/20, not built: for agent-token jobs whose owner has a box public key, sealing a copy of the completed result to that key for sync-api's pending-sealed store, ADR-018.)"
does_not_own = "The configured transcription service itself; auth (sync-api)."
depends_on = ["server", "shared_api_contracts"]
public = "TranscriptionApi, QueueWorker"
card = "server/modules/whisper-server/AGENTS.md"

[module.server_sync_api]
path = "server/modules/sync-api"
owns = "Auth (users, roles, agent tokens), sync, updates, retention, store clear, log policy."
does_not_own = "Transcription (whisper-server); UI (web-fe)."
depends_on = ["server", "shared_api_contracts"]
public = "syncApiModule (installs the public HTTP routes: /v1/auth/*, /v1/sync, /v1/transcriptions, /v1/admin/*), internalModule (the service-key routes /internal/v1/token/*)"
card = "server/modules/sync-api/AGENTS.md"

[module.server_web_fe]
path = "server/modules/web-fe"
owns = "Debian container website (client-side decrypt, Trucking UI), APK/model hosting, admin panel."
does_not_own = "API logic (sync-api); design tokens (shared/ui-tokens)."
depends_on = ["server", "server_sync_api", "shared_ui_tokens", "shared_web_libs"]
public = "signin.html (the sign-in page) and js/signin-page.js (its entry script); js/signin.js, js/signin-crypto.js, js/signin-net.js, js/signin-link.js and js/aesgcm.js are the browser modules it uses"
card = "server/modules/web-fe/AGENTS.md"

[module.shared_web_libs]
path = "shared/modules/web-libs"
owns = "Parent grouping module for the web-client cryptographic libraries vendored into server/modules/web-fe. Owns no files — each library lives in its own sub-module beneath this one. Registers the group and names its sub-modules; the single depends_on target for web-fe so the Gradle copy task has one registry edge to wire."
does_not_own = "Implementation files (live in sub-modules); the Gradle copy task (server/modules/web-fe); the libsodium serving decision (never served — ADR-040)."
depends_on = ["shared"]
public = "Grouping module only; publishes no artifact (base plugin). Sub-modules: noble-ciphers, noble-hashes, noble-curves, libsodium."
card = "shared/modules/web-libs/AGENTS.md"

[module.shared_web_libs_noble_ciphers]
path = "shared/modules/web-libs/noble-ciphers"
owns = "Vendored copies of @noble/ciphers 2.4.0 (aes.js, salsa.js, _arx.js, _poly1305.js, _polyval.js, utils.js, LICENSE). Unmodified, pinned by hash."
does_not_own = "The Gradle copy task (server/modules/web-fe); any usage (web-fe aesgcm.js after copy)."
depends_on = ["shared_web_libs"]
public = "aes.js, salsa.js, _arx.js, _poly1305.js, _polyval.js, utils.js, LICENSE"
card = "shared/modules/web-libs/noble-ciphers/AGENTS.md"

[module.shared_web_libs_noble_hashes]
path = "shared/modules/web-libs/noble-hashes"
owns = "Vendored copies of @noble/hashes 2.4.0 (argon2.js, blake2.js, hkdf.js, hmac.js, _u64.js, utils.js, _blake.js, _md.js, sha2.js, LICENSE). Unmodified, pinned by hash."
does_not_own = "The Gradle copy task (server/modules/web-fe); any usage."
depends_on = ["shared_web_libs"]
public = "argon2.js, blake2.js, hkdf.js, hmac.js, _u64.js, utils.js, _blake.js, _md.js, sha2.js, LICENSE"
card = "shared/modules/web-libs/noble-hashes/AGENTS.md"

[module.shared_web_libs_noble_curves]
path = "shared/modules/web-libs/noble-curves"
owns = "Vendored copies of @noble/curves 2.4.0 (ed25519.js, utils.js, LICENSE + abstract/{curve,edwards,fft,frost,hash-to-curve,modular,montgomery,oprf}.js). Unmodified, pinned by hash."
does_not_own = "The Gradle copy task (server/modules/web-fe); any usage."
depends_on = ["shared_web_libs"]
public = "ed25519.js, utils.js, LICENSE, abstract/*.js"
card = "shared/modules/web-libs/noble-curves/AGENTS.md"

[module.shared_web_libs_libsodium]
path = "shared/modules/web-libs/libsodium"
owns = "Vendored libsodium 0.8.4 pair (libsodium-sumo.mjs, libsodium-wrappers.mjs, LICENSE). Unmodified, pinned by hash. VENDORED AND PINNED ONLY — NEVER COPIED TO A SERVED PATH (CSP no wasm-unsafe-eval; ADR-040)."
does_not_own = "Any module resolver for the bare 'libsodium-sumo' import specifier; the Gradle copy task (libsodium is excluded from web-fe's copy task)."
depends_on = ["shared_web_libs"]
public = "libsodium-sumo.mjs, libsodium-wrappers.mjs, LICENSE"
card = "shared/modules/web-libs/libsodium/AGENTS.md"

[module.server_training]
path = "server/modules/training"
owns = "Per-user voice phrase model training (CPU; GPU via Local Inference)."
does_not_own = "Sample recording (android/training-client); model hosting (web-fe)."
depends_on = ["server"]
public = "TrainingApi"
card = "server/modules/training/AGENTS.md"

[module.server_deploy]
path = "server/modules/deploy"
owns = "Git-pull deploy, docker-compose, APK signing, VPN bind, volumes, NOTICE. No certificate handling in Breaker; TLS is the admin's choice through any reverse proxy (ADR-034)."
does_not_own = "Application logic of other server modules; TLS and certificates (the admin's reverse proxy, ADR-034)."
depends_on = ["server"]
public = "None yet: no code. DeployScripts is the planned name of its scripts."
card = "server/modules/deploy/AGENTS.md"

[module.shared]
path = "shared"
owns = "Contracts + registry shared by app and server."
does_not_own = "Implementation of either side."
depends_on = []
public = "Contracts, registries"
card = "shared/AGENTS.md"

[module.shared_api_contracts]
path = "shared/modules/api-contracts"
owns = "OpenAPI spec: auth, sync, jobs, updates, admin, training."
does_not_own = "Server implementation (server/*); client implementation (android/*)."
depends_on = ["shared"]
public = "OpenAPI spec (openapi.yaml); Kotlin request and response types"
card = "shared/modules/api-contracts/AGENTS.md"

[module.shared_model_registry]
path = "shared/modules/model-registry"
owns = "Model sizes, immutable release-asset URLs, upstream checksum.txt, licenses, hosted flag."
does_not_own = "Download/verify logic (android/stt-ondevice)."
depends_on = ["shared"]
public = "ModelRegistry, ModelEntry (archiveName), ModelFamily (generated, ADR-016)"
card = "shared/modules/model-registry/AGENTS.md"

[module.shared_format_prompts]
path = "shared/modules/format-prompts"
owns = "Strict non-destructive formatting prompts for the server LLM."
does_not_own = "The formatter logic (android/format); the LLM (server)."
depends_on = ["shared"]
public = "prompts/*; FormatPrompt, PromptCatalog, PromptParameters"
card = "shared/modules/format-prompts/AGENTS.md"

[module.shared_ui_tokens]
path = "shared/modules/ui-tokens"
owns = "Trucking design tokens: colors (light/dark), type, spacing, breakpoints, CB mic + LED bar spec."
does_not_own = "Screen implementations (android/ui, server/web-fe)."
depends_on = ["shared"]
public = "tokens.css, tokens.kt"
card = "shared/modules/ui-tokens/AGENTS.md"

[module.agent_skills]
path = "agent-skills"
owns = "Working rules and readback skills for AI agents, one pair per rank (project leader, IT manager, worker), and the plan-file skill any rank uses with sub-agents; their pinned hashes and install guide."
does_not_own = "The project's own rules (ARCHITECTURE.md, module cards, ADRs); the contributing guide; any code."
depends_on = []
public = "Seven SKILL.md files (six rank skills, one shared), agent-skills/README.md"
card = "agent-skills/AGENTS.md"
