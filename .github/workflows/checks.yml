# The checks every pull request must pass before it can merge (see
# .github/CONTRIBUTING.md, section 4). Every test step also fails when it
# ran zero tests: a mistyped path runs nothing and still prints OK.
# Every job runs on GitHub only, so a mirror of this repo never starts a
# build on its own machines.
name: checks

on:
  pull_request:
  push:
    branches: [main, "module/**"]
  # Nightly: the whole build, so a change the planner skips is still built at least daily.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the commit SHA, not github.ref: a push to a module branch and the
  # pull_request event it also triggers share the same commit but a DIFFERENT
  # ref (refs/heads/module/x vs refs/pull/N/merge), so the old ref-keyed group
  # let both runs fire at once and contend for the runner's CPU -- the actual
  # cause of this repo's timing-sensitive test flakes on GitHub's shared
  # runners (the same suite is reliably green on our own hardware).
  group: checks-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repo structure and Python tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Registry and tree agree
        run: python3 tools/check_repo.py
      - name: Contract tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/contract -t tests/contract 2>&1 | tee contract.log
          grep -Eq '^Ran [1-9][0-9]* tests?' contract.log || { echo "::error::contract tests ran 0 tests"; exit 1; }
      - name: Python unit tests, every folder that has them
        run: |
          set -eo pipefail
          dirs=$(find tests/unit -name 'test_*.py' -printf '%h\n' | sort -u)
          [ -n "$dirs" ] || { echo "::error::no Python unit tests found under tests/unit"; exit 1; }
          for d in $dirs; do
            echo "== $d"
            python3 -m unittest discover -s "$d" 2>&1 | tee unit.log
            grep -Eq '^Ran [1-9][0-9]* tests?' unit.log || { echo "::error::$d ran 0 tests"; exit 1; }
          done

  build:
    name: Gradle build and Kotlin tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the planner diffs the pull request base and head commits.
          fetch-depth: 0
      - name: Gradle wrapper is the published one
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          # Persists ~/.gradle/caches (dependency jars + build cache entries)
          # between runs via GitHub's actions cache. Every run before this was
          # a fully cold download of the whole dependency tree from Maven
          # Central -- across this repo's bursts of concurrent CI runs that
          # traffic gets grouped with the rest of GitHub's shared Azure egress
          # by Maven Central's rate limiter, not counted as ours alone.
          cache: gradle
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Plan the Gradle tasks
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The explanation goes into this log: every module, why it is in the plan.
            python3 tools/affected_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" --explain
            MODE=$(python3 tools/affected_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" --mode)
            TASKS=$(python3 tools/affected_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" --gradle)
            TESTS=$(python3 tools/affected_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" --test-projects)
          else
            # Pushes to main and module branches, the nightly run and manual runs build everything.
            MODE=full
            TASKS=build
            TESTS=
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "test_projects=$TESTS" >> "$GITHUB_OUTPUT"
      - name: Clean build, every Kotlin test
        if: steps.plan.outputs.mode != 'none'
        env:
          TASKS: ${{ steps.plan.outputs.tasks }}
        # --rerun-tasks forced every task to re-execute even though a fresh
        # checkout has nothing to skip anyway; dropped along with
        # --no-build-cache now that the Gradle cache above can actually help
        # across runs. --no-daemon stays: nothing benefits from daemon reuse
        # on an ephemeral runner.
        run: |
          read -r -a planned <<< "$TASKS"
          ./gradlew --no-daemon "${planned[@]}"
      - name: Kotlin tests ran and passed
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TEST_PROJECTS: ${{ steps.plan.outputs.test_projects }}
        run: |
          python3 - <<'EOF'
          import glob, os, sys, xml.etree.ElementTree as ET
          total = bad = 0
          for f in glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True):
              s = ET.parse(f).getroot()
              total += int(s.get("tests", 0))
              bad += int(s.get("failures", 0)) + int(s.get("errors", 0))
          print(f"Kotlin tests: {total} run, {bad} failed")
          mode = os.environ.get("MODE", "full")
          planned = os.environ.get("TEST_PROJECTS", "").split()
          print(f"plan mode: {mode}; planned projects with Kotlin tests: {len(planned)}")
          # Zero tests is allowed only when no planned project has tests: a none plan, or a plan
          # of modules without test sources. A full run plans every tested project, so zero fails.
          if total == 0 and (mode == "full" or planned):
              print("::error::Kotlin tests ran 0 tests, but the plan has projects with Kotlin tests")
              sys.exit(1)
          sys.exit(1 if bad else 0)
          EOF

  web-fe-node:
    name: web-fe node tests (build-output layout)
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
      - name: Assemble temp tree mirroring build output, run node --test
        run: python3 tools/assemble_weblibs_test_tree.py

  vendored-libs:
    name: Vendored noble libs vs npm tarball
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify vendored noble files against upstream npm tarball
        run: python3 tools/verify_vendored_libs.py

  secrets:
    name: Secret scan
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum pinned)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --config .github/gitleaks.toml --redact --no-banner --verbose

  openapi-validate:
    name: OpenAPI validation
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    env:
      OPENAPI_GENERATOR_VERSION: "7.26.0"
      OPENAPI_GENERATOR_SHA256: "1760050094997b9cc790cc1350be095f15da8c08a996b184d3eadc4ccda5e35e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Download openapi-generator-cli (checksum pinned)
        run: |
          curl -fSL -o openapi-generator-cli.jar "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${OPENAPI_GENERATOR_VERSION}/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar"
          echo "${OPENAPI_GENERATOR_SHA256}  openapi-generator-cli.jar" | sha256sum -c -
      - name: Validate OpenAPI spec
        run: java -jar openapi-generator-cli.jar validate -i shared/modules/api-contracts/openapi.yaml
