# MODULE_PLAN.toml - the master module plan (read by the module status tracker of the module-sop project).
# modules.toml says what EXISTS. This file says what is EXPECTED when each module is finished.
#   expected_subs = [...]  the sub-module folder names the finished module has ([] = documented: none).
#                          A sub-module that exists but is not listed is counted and flagged NEW; a listed one that
#                          does not exist (or is marked dead) shows as NOT_STARTED. Nothing here needs editing when
#                          a listed sub-module is built: it flips to DONE by itself.
#   issue = N              the GitHub issue that closes the module out.
# BASELINE (first version): sub-modules as registered today are the expected set; no other plan is documented.
# Owner changes the lists when the architecture changes.

