# Breaker — toolchain versions.
#
# Single source of truth for the Android/Kotlin build. Changing a version here
# changes it for every module; no module build file pins a version itself.

[versions]
agp = "9.4.1"   # read 2026-10-04 from https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
kotlin = "2.4.20"   # read 2026-10-04 from https://kotlinlang.org/docs/whatsnew24.html
compileSdk = "36"   # read 2026-10-04 from https://dl.google.com/android/repository/repository2-3.xml (platforms;android-36 = platform-36_r02.zip)
targetSdk = "36"   # read 2026-10-04 from https://dl.google.com/android/repository/repository2-3.xml (build-tools;36.0.0 = build-tools_r36_linux.zip)
minSdk = "30"
junit = "4.13.2"
sqlite-jdbc = "3.53.4.0"
kotlinx-coroutines = "1.11.0"   # read 2026-10-05 from https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core/maven-metadata.xml (newest stable; core artifact only)
ktor = "3.6.0"   # read 2026-10-07 from https://repo1.maven.org/maven2/io/ktor/ktor-server-core/maven-metadata.xml (release 3.6.0, published 2026-09-16)

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# Test-only in the android modules (real SQLite for HistorySql on the desktop JVM, never shipped there); the runtime driver in server/modules/sync-api.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
