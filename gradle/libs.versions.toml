# Breaker — toolchain versions.
#
# Single source of truth for the Android/Kotlin build. Changing a version here
# changes it for every module; no module build file pins a version itself.

[versions]
agp = "9.4.1"   # read 2026-10-04 from https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
kotlin = "2.4.20"   # read 2026-10-04 from https://kotlinlang.org/docs/whatsnew24.html
compileSdk = "36"   # read 2026-10-04 from https://dl.google.com/android/repository/repository2-3.xml (platforms;android-36 = platform-36_r02.zip)
targetSdk = "36"   # read 2026-10-04 from https://dl.google.com/android/repository/repository2-3.xml (build-tools;36.0.0 = build-tools_r36_linux.zip)
minSdk = "30"
junit = "4.13.2"
sqlite-jdbc = "3.53.4.0"
kotlinx-coroutines = "1.11.0"   # read 2026-10-05 from https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core/maven-metadata.xml (newest stable; core artifact only)
commons-compress = "1.28.0"   # read 2026-10-07 from https://repo1.maven.org/maven2/org/apache/commons/commons-compress/maven-metadata.xml
# Pulled in by commons-compress, version resolved by Gradle (no entry here): commons-codec 1.19.0   # read 2026-10-07 from https://repo1.maven.org/maven2/commons-codec/commons-codec/maven-metadata.xml
# Pulled in by commons-compress, version resolved by Gradle (no entry here): commons-io 2.20.0   # read 2026-10-07 from https://repo1.maven.org/maven2/commons-io/commons-io/maven-metadata.xml
# Pulled in by commons-compress, version resolved by Gradle (no entry here): commons-lang3 3.18.0   # read 2026-10-07 from https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/maven-metadata.xml

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# JVM unit tests only (real SQLite for HistorySql); must never be a non-test dependency.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# Unpacks the model archive (tar inside bzip2); imported by ModelExtractor.kt only.
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
