# The distribution below is pinned to the SHA-256 checksum published by the
# Gradle project for gradle-8.13-bin.zip, so the Gradle Wrapper verifies the
# download and fails loudly on a tampered or substituted distribution.
# Source of truth: https://gradle.org/release-checksums/ (section 8.13)
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
