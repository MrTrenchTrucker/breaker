      responses:
        "204":
          description: Session ended
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "404":
          description: No such session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "No such session"
        "503":
          description: A storage failure gets this fixed answer, with no part of the failure echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/sync:
    post:
      summary: Push transcriptions
      description: >-
        Push a transcription for the authenticated account. Idempotent on
        the pair (client_id, key_version), not on client_id alone: the same
        pair is a no-op; the same client_id at a higher key_version is an
        atomic replace (the stored row is updated in place: it is the same row, so it keeps its
        place in the list, and the decision and the update share one transaction); the same
        client_id at a lower key_version, or a brand-new client_id below the
        account's current key_version, is refused (409). A pending-sealed
        re-upload sends client_id = the pending record's id at the
        account's current key_version (a new record, not a replace).

        The encrypted field of a SyncPush holds one transcription body. At
        key_version 0 it is the standard base64 (RFC 4648, padded, no line wrap)
        of an R1 body, and no cryptography is applied. A key_version 0 body is
        development-only until Phase 19. At key_version 1 or higher the field is
        the Phase 19 form, which is not built.

        An R1 body is one UTF-8 JSON object. Its keys are written in this fixed
        order: v, text, source, model, duration_ms, created_at. No other key is
        allowed. v is the integer 1. text is a string. source is the string
        local or the string server, compared exactly. model is a string and may
        be empty. duration_ms is an integer from 0 to 9007199254740991.
        created_at is when the transcription was made, in UTC, exactly in the
        form YYYY-MM-DDTHH:MM:SS.sssZ (three fractional digits), a real calendar
        date and time, no earlier than 1970-01-01T00:00:00.000Z and no later
        than 9999-12-31T23:59:59.999Z. audio_path is never part of the body.

        The writer puts no whitespace in the body. It escapes only the quotation
        mark, the backslash and the control characters below U+0020, as \b \f
        \n \r \t or as \u00xx in lower-case hex. Every other character is written
        as raw UTF-8. A lone surrogate in text or model is refused.

        The reader accepts the keys in any order, JSON whitespace (space, tab,
        line feed, carriage return) and every standard escape. It refuses a byte
        order mark, bytes that are not valid UTF-8, a lone surrogate escape,
        bytes after the object, a duplicate key, an unknown key, a missing key, a
        value of the wrong type, any v other than the integer 1 (so "1", 1.0, 01
        and 2 are refused), a source other than local or server (so Local is
        refused), a duration_ms with a sign, a fraction, an exponent or a leading
        zero, or outside the range above, and a created_at outside the form above,
        such as one with no milliseconds, no Z, an offset, a lower-case t or z, a
        second of 60, an hour of 24, a date that does not exist such as February
        30, or a year before 1970.

        The key_version 0 text is standard base64 (RFC 4648, plus and slash
        alphabet) with padding, and with no line break or whitespace. The reader refuses
        URL-safe characters, wrong or missing padding and non-zero bits after the last data
        bit. That is a rule of the reader, not of the server: the server does not check the
        trailing bits. It stores the text as sent, after the checks of the 400 response.
        The codec sets no size limit. The server route sets a limit of 1 MiB
        (1,048,576 bytes) on the body of this operation: the exact limit is accepted, and one
        byte more is refused with 413 before the body is parsed.
        A body with any member other than client_id, key_version, encrypted
        and resave is refused with 400. The optional boolean member resave
        carries the re-save mark: absent or false means no mark; true means
        the mark (first push of an id the phone itself deleted, never a
        retry). A resave that is not a boolean (string, number, null) is a
        400. A push of a client id that is deleted on the server answers 204
        and writes nothing, unless it carries the mark: with the mark it is a
        fresh save (the new body, deleted becomes false, a new change number
        is taken, 204). The mark on an id that is not deleted changes nothing.
      operationId: syncPush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPush"
            example:
              client_id: "0f9c4d1e-6a2b-4c3d-9e8f-1a2b3c4d5e6f"
              key_version: 0
              encrypted: "eyJ2IjoxLCJ0ZXh0IjoiaGVsbG8gZnJvbSB0aGUgcGhvbmUiLCJzb3VyY2UiOiJsb2NhbCIsIm1vZGVsIjoiYmFzZS5lbiIsImR1cmF0aW9uX21zIjoxNTAwLCJjcmVhdGVkX2F0IjoiMjAyNi0xMC0xMVQxMjowMDowMC4wMDBaIn0="
      responses:
        "204":
          description: Pushed (stored, replaced, or the no-op of the same pair already on file)
        "400":
          description: >-
            Bad request. The body is not one JSON object with exactly the keys client_id,
            key_version and encrypted, or a field breaks its rule: client_id is not a
            lowercase canonical UUID, key_version is not a whole number from 0 up to the
            largest signed 32-bit integer, or encrypted is not non-empty standard base64
            with correct padding and no whitespace. The message names the rule and never
            echoes the input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "request body must be one JSON object with exactly the keys client_id, key_version and encrypted"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "409":
          description: >-
            Version refused. A push whose key_version is above the account's current
            key_version gets the message "key_version is above the account's current
            key_version". A lower key_version for a client_id already stored, or a
            brand-new client_id below the account's current key_version, gets the message
            in the example.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "conflict"
                message: "A lower key_version is refused for this client_id"
        "413":
          description: Request entity too large. The body is over the 1 MiB cap (1,048,576 bytes). The exact cap is accepted; one byte more is refused before the body is parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: A storage failure or a failed session check gets this answer. The body is fixed and no part of the failure is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
