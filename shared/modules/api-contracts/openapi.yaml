                message: "User session token required; an agent token is refused"
        "404":
          description: No such device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "No such device"
        "503":
          description: A storage failure gets this fixed answer, with no part of the failure echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/devices/sign-out-all:
    post:
      summary: Sign out all devices of the caller's account
      description: >-
        A user session ends every device of its own account including the calling device
        (the presented token is dead afterwards); the account's unredeemed sign-in codes
        are deleted in the same transaction; agent tokens are never revoked by this route;
        an agent token is refused with 403.
      operationId: signOutAllDevices
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Every device of the account is signed out
        "401":
          description: Refused with no, bad or dead user session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Refused. A valid token of the wrong kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "503":
          description: A storage failure gets this fixed answer, with no part of the failure echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/admin/agent-tokens/{id}:
