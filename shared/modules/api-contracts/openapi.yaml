openapi: "3.0.3"
info:
  title: Breaker API — transcription-job contract (slice 1)
  description: >-
    The transcription-job contract: enqueue an audio transcription job, poll its
    status and result, and check service health. This is the single contract both
    the Android client (stt-server) and the server (whisper-server) implement.
  version: "1.0.0"
paths:
  /v1/audio/transcriptions:
    post:
      summary: Enqueue a transcription job
      description: >-
        Accepts an audio file and enqueues a transcription job. The job is
        processed asynchronously; poll GET /v1/jobs/{job_id} for the result.
      operationId: createTranscriptionJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file to transcribe (WAV, MP3, etc.)
                model:
                  type: string
                  description: The model to use for transcription (optional)
                language:
                  type: string
                  description: The language of the audio (optional, e.g. "en")
            example:
              file: "examples/golden.wav"
              model: "whisper-large-v3"
              language: "en"
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
              example:
                job_id: "12345"
                status: "queued"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "File exceeds maximum allowed size"
  /v1/jobs/{job_id}:
    get:
      summary: Get job status and result
      description: >-
        Returns the current status of a transcription job and, when done,
        the transcription result.
      operationId: getJobStatus
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The job ID returned when the job was created; an opaque string the client echoes back unchanged and never parses (the server emits an opaque numeric-ish id).
      responses:
        "200":
          description: Job status and result (if done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              example:
                status: "done"
                result:
                  text: "Hello, world!"
                  segments:
                    - start: 0.0
                      end: 1.5
                      text: "Hello,"
                    - start: 1.5
                      end: 3.0
                      text: "world!"
                  language: "en"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "404":
          description: Job not found — the job_id is unknown, non-numeric, or its result has passed its TTL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # NOTE (pre-existing shape mismatch, out of scope for this slice and NOT fixed here): the
              # server's real 404 body is the single-field object {"error":"unknown or expired"} with no
              # `message`, so it does not match the two-field Error schema above. Flagged, not restructured.
              example:
                error: "unknown or expired"
                message: "The job id is unknown, or its result has passed its retention window"
  /v1/auth/register:
    post:
      summary: Register a new account
      description: >-
        Register a new account. Never a password, never a DEK — the client
        derives the KEK and sends the verifier. First account = admin.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: "alice"
              salt: "c2FsdA=="
              kdf_params:
                memory_kib: 65536
                iterations: 3
                parallelism: 1
              kdf_version: 1
              auth_verifier: "dmVyaWZpZXI="
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                username: "alice"
                role: "admin"
        "400":
          description: Invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid_field"
                message: "kdf_params below floor or salt length invalid"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "username_taken"
                message: "Username already registered"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
  /v1/auth/salt:
    post:
      summary: Get account salt and KDF parameters
      description: >-
        Returns the salt and KDF parameters for an account. No decoy: an
        unknown username gets an honest "no such account".
      operationId: getSalt
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltRequest"
            example:
              username: "alice"
      responses:
        "200":
          description: Salt and KDF parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaltResponse"
              example:
                salt: "c2FsdA=="
                kdf_params:
                  memory_kib: 65536
                  iterations: 3
                  parallelism: 1
                kdf_version: 1
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "no_such_account"
                message: "No such account"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
  /v1/auth/login:
    post:
      summary: Log in
      description: >-
        Log in with username and auth_verifier. Returns a session token and
        the account's wrapped keys (null together for a keyless account).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "alice"
              auth_verifier: "dmVyaWZpZXI="
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: "tok_abc123"
                role: "admin"
                wrapped_dek: null
                wrapped_box_privkey: null
                box_pubkey: null
                key_version: 0
                prev_wrapped_dek: null
                reset_at: null
                rekeyed_at: null
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid username or verifier"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
  /v1/auth/logout:
    post:
      summary: Log out
      description: Revoke the presented session token.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
  /v1/admin/agent-tokens/{id}:
    delete:
      summary: Revoke an agent token
      description: >-
        Admin-only: revoke an agent token by id.
      operationId: revokeAgentToken
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The agent token id
      responses:
        "204":
          description: Token revoked
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "Agent token not found"
  /v1/sync:
    post:
      summary: Push transcriptions
      description: >-
        Push a transcription for the authenticated account. Idempotent on
        the pair (client_id, key_version), not on client_id alone: the same
        pair is a no-op; the same client_id at a higher key_version is an
        atomic replace (the stored row is updated in place: it is the same row, so it keeps its
        place in the list, and the decision and the update share one transaction); the same
        client_id at a lower key_version, or a brand-new client_id below the
        account's current key_version, is refused (409). A pending-sealed
        re-upload sends client_id = the pending record's id at the
        account's current key_version (a new record, not a replace).

        The encrypted field of a SyncPush holds one transcription body. At
        key_version 0 it is the standard base64 (RFC 4648, padded, no line wrap)
        of an R1 body, and no cryptography is applied. A key_version 0 body is
        development-only until Phase 19. At key_version 1 or higher the field is
        the Phase 19 form, which is not built.

        An R1 body is one UTF-8 JSON object. Its keys are written in this fixed
        order: v, text, source, model, duration_ms, created_at. No other key is
        allowed. v is the integer 1. text is a string. source is the string
        local or the string server, compared exactly. model is a string and may
        be empty. duration_ms is an integer from 0 to 9007199254740991.
        created_at is when the transcription was made, in UTC, exactly in the
        form YYYY-MM-DDTHH:MM:SS.sssZ (three fractional digits), a real calendar
        date and time, no earlier than 1970-01-01T00:00:00.000Z and no later
        than 9999-12-31T23:59:59.999Z. audio_path is never part of the body.

        The writer puts no whitespace in the body. It escapes only the quotation
        mark, the backslash and the control characters below U+0020, as \b \f
        \n \r \t or as \u00xx in lower-case hex. Every other character is written
        as raw UTF-8. A lone surrogate in text or model is refused.

        The reader accepts the keys in any order, JSON whitespace (space, tab,
        line feed, carriage return) and every standard escape. It refuses a byte
        order mark, bytes that are not valid UTF-8, a lone surrogate escape,
        bytes after the object, a duplicate key, an unknown key, a missing key, a
        value of the wrong type, any v other than the integer 1 (so "1", 1.0, 01
        and 2 are refused), a source other than local or server (so Local is
        refused), a duration_ms with a sign, a fraction, an exponent or a leading
        zero, or outside the range above, and a created_at outside the form above,
        such as one with no milliseconds, no Z, an offset, a lower-case t or z, a
        second of 60, an hour of 24, a date that does not exist such as February
        30, or a year before 1970.

        The key_version 0 text is standard base64 (RFC 4648, plus and slash
        alphabet) with padding, and with no line break or whitespace. The reader refuses
        URL-safe characters, wrong or missing padding and non-zero bits after the last data
        bit. That is a rule of the reader, not of the server: the server does not check the
        trailing bits. It stores the text as sent, after the checks of the 400 response.
        The codec sets no size limit. The server route sets a limit of 1 MiB
        (1,048,576 bytes) on the body of this operation: the exact limit is accepted, and one
        byte more is refused with 413 before the body is parsed.
      operationId: syncPush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPush"
            example:
              client_id: "0f9c4d1e-6a2b-4c3d-9e8f-1a2b3c4d5e6f"
              key_version: 0
              encrypted: "eyJ2IjoxLCJ0ZXh0IjoiaGVsbG8gZnJvbSB0aGUgcGhvbmUiLCJzb3VyY2UiOiJsb2NhbCIsIm1vZGVsIjoiYmFzZS5lbiIsImR1cmF0aW9uX21zIjoxNTAwLCJjcmVhdGVkX2F0IjoiMjAyNi0xMC0xMVQxMjowMDowMC4wMDBaIn0="
      responses:
        "204":
          description: Pushed (stored, replaced, or the no-op of the same pair already on file)
        "400":
          description: >-
            Bad request. The body is not one JSON object with exactly the keys client_id,
            key_version and encrypted, or a field breaks its rule: client_id is not a
            lowercase canonical UUID, key_version is not a whole number from 0 up to the
            largest signed 32-bit integer, or encrypted is not non-empty standard base64
            with correct padding and no whitespace. The message names the rule and never
            echoes the input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "request body must be one JSON object with exactly the keys client_id, key_version and encrypted"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "409":
          description: >-
            Version refused. A push whose key_version is above the account's current
            key_version gets the message "key_version is above the account's current
            key_version". A lower key_version for a client_id already stored, or a
            brand-new client_id below the account's current key_version, gets the message
            in the example.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "conflict"
                message: "A lower key_version is refused for this client_id"
        "413":
          description: Request entity too large. The body is over the 1 MiB cap (1,048,576 bytes). The exact cap is accepted; one byte more is refused before the body is parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: A storage failure or a failed session check gets this answer. The body is fixed and no part of the failure is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/admin/agent-tokens:
    post:
      summary: Create an agent token
      description: >-
        The account admin creates an agent token for its owner account.
        The token value is returned only in this response and never again;
        the list endpoint never returns token values. An agent token may
        call POST /v1/audio/transcriptions and GET /v1/jobs/{job_id};
        expires_at null means no expiry; scope (transcribe or admin)
        defaults to transcribe when omitted.
      operationId: adminCreateAgentToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenCreateRequest"
            example:
              name: "Syn transcription token"
              owner_username: "alice@example.com"
              scope: transcribe
              expires_at: null
      responses:
        "201":
          description: Agent token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToken"
              example:
                token: "atk_abc123"
                name: "Syn transcription token"
                owner_username: "alice@example.com"
                scope: transcribe
                expires_at: null
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
    get:
      summary: List agent tokens
      description: >-
        Lists the account's agent tokens (id, name, owner, scope, expiry);
        the token value is returned only at creation, never here.
      operationId: adminListAgentTokens
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTokenEntry"
              example:
                - id: 1
                  name: "Syn transcription token"
                  owner_username: "alice@example.com"
                  scope: transcribe
                  expires_at: null
                - id: 2
                  name: "Admin transcription token"
                  owner_username: "alice@example.com"
                  scope: admin
                  expires_at: null
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
  /v1/admin/roles:
    post:
      summary: Set an account's admin role
      description: >-
        Admin-only: grant or revoke another account's admin role. An admin
        assigns the admin role to a fresh account so it can bootstrap; revoke
        it to demote a former admin back to user.
      operationId: adminSetRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateRequest"
            example:
              username: "alice@example.com"
              admin: true
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleUpdateResponse"
              example:
                username: "alice@example.com"
                role: "admin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
  /v1/admin/health:
    get:
      summary: Read the admin service health and git tag
      description: >-
        Admin-only, unauthenticated-health-safe. Reports the in-process status
        (ready, starting up, degraded) and the released GIT tag that built it.
      operationId: adminHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
              example:
                status: "ok"
                git_tag: "1.2.3"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
  /v1/admin/transcription-service:
    get:
      summary: Read the configured transcription service
      description: >-
        Admin-only. Reports the configured name, base_url and enabled flag, plus
        api_key_set — a boolean reporting whether an API key is stored. The key
        value itself is never returned here.
      operationId: adminGetTranscriptionService
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configured transcription service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionService"
              example:
                name: "whisper-server"
                base_url: "https://example.com"
                api_key_set: true
                enabled: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
    put:
      summary: Configure the transcription service
      description: >-
        Admin-only, last-write-wins. Updates name/base_url/enabled; api_key is
        optional and write-only — omit it or send null to leave the stored key
        unchanged. The returned resource never echoes the key.
      operationId: adminPutTranscriptionService
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionServiceUpdate"
            example:
              name: "whisper-server"
              base_url: "https://example.com"
              enabled: true
              api_key: "tok_abc123"
      responses:
        "200":
          description: Configured transcription service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionService"
              example:
                name: "whisper-server"
                base_url: "https://example.com"
                api_key_set: true
                enabled: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
  /v1/admin/test-service:
    post:
      summary: Probe the transcription service connectivity
      description: >-
        Admin-only. Runs a connectivity probe against the configured
        transcription service (a GET against base_url) and reports whether it is
        reachable. The URL is validated before any
        network attempt, so an unparseable or disallowed base_url fails fast
        without contacting hostnames the admin did not intend to reach.
      operationId: adminTestService
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connectivity probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestServiceResult"
              example:
                reachable: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
  /v1/admin/reset-account:
    post:
      summary: Reset an account's keys and data with a one-time code
      description: >-
        Admin-only: resets an account by deleting that account's keys,
        deletes its transcriptions outright, deletes any still-unfetched
        pending-sealed rows for it, revokes its tokens, and issues a one-time
        reset code (at least 128 random bits, single use, 24-hour expiry) for
        the admin to pass to the user out of band. Callable with an admin session
        token OR an admin-scoped agent token — the single bearerAuth scheme
        cannot distinguish these two callers, so both are accepted.
      operationId: adminResetAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetAccountRequest"
            example:
              username: "alice@example.com"
      responses:
        "200":
          description: Reset code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetAccountResponse"
              example:
                reset_code: "rc_abc123"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "Account not found"
  /v1/admin/clear-store:
    post:
      summary: Clear the transcription store for one or all users
      description: >-
        Admin-only: clears stored transcriptions either per-user or, when
        username is null or omitted, for all users. confirm must be true — a
        false/absent value is refused with 400 to prevent accidental mass-clears.
      operationId: adminClearStore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearStoreRequest"
            example:
              username: "alice@example.com"
              confirm: true
      responses:
        "200":
          description: Store cleared
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "confirm must be true"
  /v1/transcriptions:
    get:
      summary: Pull the account's transcriptions
      description: >-
        Pull the authenticated account's transcriptions, each with its own
        key_version so a client can tell which of its own rows still need
        replacing after an interrupted migration or re-key.
      operationId: listTranscriptions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account's transcription records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranscriptionRecord"
              example:
                - client_id: "0f9c4d1e-6a2b-4c3d-9e8f-1a2b3c4d5e6f"
                  key_version: 0
                  encrypted: "eyJ2IjoxLCJ0ZXh0IjoiaGVsbG8gZnJvbSB0aGUgcGhvbmUiLCJzb3VyY2UiOiJsb2NhbCIsIm1vZGVsIjoiYmFzZS5lbiIsImR1cmF0aW9uX21zIjoxNTAwLCJjcmVhdGVkX2F0IjoiMjAyNi0xMC0xMVQxMjowMDowMC4wMDBaIn0="
                  stored_at: "2026-10-11T12:00:05Z"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "503":
          description: A storage failure, a stored time that cannot be formatted, or a failed session check gets this answer. The body is fixed and no part of the failure is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/sync/pending-sealed:
    get:
      summary: List the owner's still-sealed results
      description: >-
        The authenticated owner's still-sealed agent-token job results: a
        list of sealed boxes. The owner's client unseals each with its box
        private key and re-uploads it via POST /v1/sync with client_id =
        that record's id at the account's current key_version (a new record,
        not a replace); the server deletes the pending record once a synced
        transcription with that client id lands. Honest limit: this endpoint
        returns whatever the pending-sealed store holds; it has no way to
        tell a sealed box whisper-server actually produced from one a
        database writer inserted directly - both are equally well-formed
        crypto_box_seal output, and the owner's client converts either kind
        the same way.
      operationId: listPendingSealed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The owner's pending-sealed records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSealed"
              example:
                - id: "3b2c9f0a-7d4e-4a1b-8c5d-6e7f8091a2b3"
                  sealed_box: "cmVwbGFjZS13aXRoLXNhbXBsZS1zZWFsZWQtYm94"
                  created_at: "2026-10-11T12:00:00Z"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
  /health:
    get:
      summary: Health check
      description: Returns the health status of the service.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: "ok"
                forwarding_to: "whisper-server:8080"
                uptime: "1h23m45s"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JobStatus:
      type: string
      enum:
        - queued
        - processing
        - done
        - failed
      description: >-
        The status of a transcription job. Named schema shared by Job and
        JobAccepted; JobAccepted.status narrows it to [queued].
    JobAccepted:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          description: The unique identifier for the job
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          enum:
            - queued
          description: >-
            The initial status of the job. The enum narrows the JobStatus
            values a 202 may carry to exactly [queued]; a job is accepted as
            queued and nothing else. The Kotlin side must be JobStatus with
            the same narrowing at construction.
    Job:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: The current status of the job
        result:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TranscriptionResult"
          description: The transcription result (null until status is "done")
        error:
          type: string
          nullable: true
          description: >-
            The failure reason; non-null exactly when status is "failed".
            This is the contract's failure-reason field: whisper-server
            surfaces failures as failed with a clear error, and the
            stt-server client reads it into SttResult.failure.
    TranscriptionResult:
      type: object
      required:
        - text
        - segments
        - language
      properties:
        text:
          type: string
          description: The full transcribed text
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
          description: The individual segments of the transcription
        language:
          type: string
          description: The detected or specified language; empty when the service reported none
    Segment:
      type: object
      required:
        - start
        - end
        - text
      properties:
        start:
          type: number
          format: float
          description: Start time in seconds
        end:
          type: number
          format: float
          description: End time in seconds
        text:
          type: string
          description: The text of this segment
    Health:
      type: object
      required:
        - status
        - forwarding_to
        - uptime
      properties:
        status:
          type: string
          description: The health status ("ok", "degraded", etc.)
        forwarding_to:
          type: string
          description: The upstream service being forwarded to
        uptime:
          type: string
          description: How long the service has been running
    RegisterRequest:
      type: object
      required:
        - username
        - salt
        - kdf_params
        - kdf_version
        - auth_verifier
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username (ASCII [A-Za-z0-9._-], 1-64 chars)
        salt:
          type: string
          pattern: "^[A-Za-z0-9+/]{22}==$"
          description: The salt, base64 padded, 16 bytes after decode
        kdf_params:
          $ref: "#/components/schemas/KdfParams"
        kdf_version:
          type: integer
          enum: [1]
          description: Must equal 1
        auth_verifier:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The auth verifier, base64 padded, 32 bytes after decode
    RegisterResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
          description: The account username
        role:
          type: string
          description: The account role ("admin" or "user")
    SaltRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username
    SaltResponse:
      type: object
      required:
        - salt
        - kdf_params
        - kdf_version
      properties:
        salt:
          type: string
          pattern: "^[A-Za-z0-9+/]{22}==$"
          description: The salt, base64 padded, 16 bytes after decode
        kdf_params:
          $ref: "#/components/schemas/KdfParams"
        kdf_version:
          type: integer
          description: Must equal 1
    LoginRequest:
      type: object
      required:
        - username
        - auth_verifier
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username
        auth_verifier:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The auth verifier, base64 padded, 32 bytes after decode
    LoginResponse:
      type: object
      required:
        - token
        - role
        - key_version
      properties:
        token:
          type: string
          description: The session token
        role:
          type: string
          description: The account role ("admin" or "user")
        wrapped_dek:
          type: string
          nullable: true
          description: The wrapped DEK, base64 padded; null together with other key fields for a keyless account
        wrapped_box_privkey:
          type: string
          nullable: true
          description: The wrapped box private key, base64 padded; null together
        box_pubkey:
          type: string
          nullable: true
          description: The box public key, base64 padded; null together
        key_version:
          type: integer
          description: The account's current DEK generation; 0 before first bootstrap
        prev_wrapped_dek:
          type: string
          nullable: true
          description: The previous DEK wrapped with the current one; null unless re-key unfinished
        reset_at:
          type: string
          nullable: true
          description: The account's last-reset timestamp, or null
        rekeyed_at:
          type: string
          nullable: true
          description: The account's last-rekey timestamp, or null
    KdfParams:
      type: object
      required:
        - memory_kib
        - iterations
        - parallelism
      properties:
        memory_kib:
          type: integer
          minimum: 65536
          maximum: 262144
          description: Memory in KiB (65536-262144)
        iterations:
          type: integer
          minimum: 3
          maximum: 10
          description: Iterations (3-10)
        parallelism:
          type: integer
          minimum: 1
          maximum: 4
          description: Parallelism (1-4)
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: The error code
        message:
          type: string
          description: A human-readable error message
    SyncPush:
      type: object
      required:
        - client_id
        - key_version
        - encrypted
      properties:
        client_id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The transcription's client id, a lowercase canonical UUID (8-4-4-4-12 lowercase hex digits with hyphens)
        key_version:
          type: integer
          minimum: 0
          description: The account's DEK generation the encrypted body was sealed under (0 before the first bootstrap, and 0 means no cryptography, see encrypted)
        encrypted:
          type: string
          description: >-
            At key_version 0 this is the standard base64 (RFC 4648, padded, no
            line wrap) of the R1 body described in the /v1/sync operation, and
            no cryptography is applied: a key_version 0 body is development-only
            until Phase 19. At key_version 1 or higher it is the Phase 19 form,
            which is not built.
    TranscriptionRecord:
      type: object
      required:
        - client_id
        - key_version
        - encrypted
        - stored_at
      properties:
        client_id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The transcription's client id, a lowercase canonical UUID (8-4-4-4-12 lowercase hex digits with hyphens)
        key_version:
          type: integer
          description: The key_version this row was stored under
        encrypted:
          type: string
          description: >-
            At key_version 0 this is the standard base64 (RFC 4648, padded, no
            line wrap) of the R1 body described in the /v1/sync operation, and
            no cryptography is applied: a key_version 0 body is development-only
            until Phase 19. At key_version 1 or higher it is the Phase 19 form,
            which is not built.
        stored_at:
          type: string
          description: When the server stored the row (RFC 3339)
    PendingSealed:
      type: object
      required:
        - id
        - sealed_box
        - created_at
      properties:
        id:
          type: string
          description: The client id the re-upload must carry (the transcription this sealed box will become)
        sealed_box:
          type: string
          description: The sealed box (crypto_box_seal output), base64
        created_at:
          type: string
          description: When the box was sealed (RFC 3339)

    AgentTokenScope:
      type: string
      enum:
        - transcribe
        - admin
      description: >-
        The token's scope. `transcribe` lets it call the transcription
        endpoints, `admin` additionally the admin group.
    AgentTokenCreateRequest:
      type: object
      required:
        - name
        - owner_username
      properties:
        name:
          type: string
        owner_username:
          type: string
        scope:
          allOf:
            - $ref: "#/components/schemas/AgentTokenScope"
          nullable: true
          default: transcribe
          description: the token's scope; defaults to transcribe
        expires_at:
          type: string
          nullable: true
          description: null for no expiry
    AgentToken:
      type: object
      required:
        - token
        - name
        - owner_username
        - scope
      properties:
        token:
          type: string
          description: the token value, returned only here, never again
        name:
          type: string
        owner_username:
          type: string
        scope:
          $ref: "#/components/schemas/AgentTokenScope"
        expires_at:
          type: string
          nullable: true
    AgentTokenEntry:
      type: object
      required:
        - id
        - name
        - owner_username
        - scope
      properties:
        id:
          type: integer
          format: int64
          description: the token id, the value the revoke path's {id} takes
        name:
          type: string
        owner_username:
          type: string
        scope:
          $ref: "#/components/schemas/AgentTokenScope"
        expires_at:
          type: string
          nullable: true
    RoleUpdateRequest:
      type: object
      required:
        - username
        - admin
      properties:
        username:
          type: string
        admin:
          type: boolean
    RoleUpdateResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          type: string
          description: The account role ("admin" or "user")
    AdminHealth:
      type: object
      required:
        - status
        - git_tag
      properties:
        status:
          type: string
        git_tag:
          type: string
    TranscriptionService:
      type: object
      required:
        - name
        - base_url
        - api_key_set
        - enabled
      properties:
        name:
          type: string
        base_url:
          type: string
        api_key_set:
          type: boolean
        enabled:
          type: boolean
    TranscriptionServiceUpdate:
      type: object
      required:
        - name
        - base_url
        - enabled
      properties:
        name:
          type: string
        base_url:
          type: string
        enabled:
          type: boolean
        api_key:
          type: string
          nullable: true
    TestServiceResult:
      type: object
      required:
        - reachable
      properties:
        reachable:
          type: boolean
    ResetAccountRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    ResetAccountResponse:
      type: object
      required:
        - reset_code
      properties:
        reset_code:
          type: string
    ClearStoreRequest:
      type: object
      required:
        - confirm
      properties:
        username:
          type: string
          nullable: true
        confirm:
          type: boolean
