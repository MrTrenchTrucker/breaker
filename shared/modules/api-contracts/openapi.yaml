          description: Store cleared
          content:
            application/json:
              schema:
                type: object
                required:
                  - cleared
                properties:
                  cleared:
                    type: integer
                    example: 3
              example:
                cleared: 3
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "confirm must be true"
        "404":
          description: Account not found (also for a user name that is not valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "Account not found"
