  /v1/admin/reset-account:
    post:
      summary: Reset an account's keys and data with a one-time code
      description: >-
        Admin-only: resets one account, by user name (any letter case), in
        one transaction. It replaces the verifier hash with 32 fresh random
        bytes (so no password can match) and marks the account reset-pending,
        deletes the account's keys (wrapped DEK, wrapped box private key, box
        public key and prev_wrapped_dek), revokes every token of the account
        (sessions and agent tokens) and its unredeemed sign-in codes, deletes
        its transcriptions outright, clears its wrong-password row, sets
        reset_at to now and issues a one-time reset code. key_version is kept
        (it never goes backwards). Pending-sealed rows are planned, not built:
        that table does not exist yet, so nothing is deleted from it.

        The reset also moves the change feed: change_seq goes up by one and the
        purged floor is set to the new change_seq, so after a reset every
        earlier cursor, also one at the old head, gets 410 from
        GET /v1/transcriptions and the client does a full resync.

        The reset code is 32 random bytes written as 43 URL-safe characters
        (256 random bits, so at least 128), single use, with a 24-hour expiry.
        Only its SHA-256 is stored. An account has one live code: a new reset
        replaces the old code, and the old one then fails. The code appears in
        this answer only and is never logged. The admin passes it to the user
        out of band; the user finishes with POST /v1/auth/complete-reset.

        Callable with an admin session token OR an admin-scoped agent token -
        the single bearerAuth scheme cannot distinguish these two callers, so
        both are accepted. The order of the checks is: the token (401), the
        admin role (403), the size (413, cap 4096 bytes), the body (400: exactly
        one member, username, a string; a null or a number is 400), then the
        name (404 for a name that is not valid and for an unknown account).
        An admin may reset their own account; that revokes the token they
        called with. A storage failure gets the fixed 503 and changes nothing.
      operationId: adminResetAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetAccountRequest"
            example:
              username: "alice"
      responses:
        "200":
          description: Reset code issued. It is shown once and is 43 URL-safe characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetAccountResponse"
              example:
                reset_code: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "400":
          description: Bad request. The body is not exactly one string member, username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Invalid request body"
        "404":
          description: Account not found (also for a user name that is not valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "Account not found"
        "413":
          description: Request entity too large. The body is over 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: A storage failure gets this answer. The body is fixed and the reset is not applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/admin/clear-store:
    post:
      summary: Clear the transcription store for one or all users
      description: >-
        Admin-only: clears stored transcriptions either per-user or, when
        username is null or omitted, for all users. confirm must be true — a
        false/absent value is refused with 400 to prevent accidental mass-clears.
