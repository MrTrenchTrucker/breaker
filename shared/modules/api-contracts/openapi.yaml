openapi: "3.0.3"
info:
  title: Breaker API — transcription-job contract (slice 1)
  description: >-
    The transcription-job contract: enqueue an audio transcription job, poll its
    status and result, and check service health. This is the single contract both
    the Android client (stt-server) and the server (whisper-server) implement.
  version: "1.0.0"
paths:
  /v1/audio/transcriptions:
    post:
      summary: Enqueue a transcription job
      description: >-
        Accepts an audio file and enqueues a transcription job. The job is
        processed asynchronously; poll GET /v1/jobs/{job_id} for the result.
      operationId: createTranscriptionJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file to transcribe (WAV, MP3, etc.)
                model:
                  type: string
                  description: The model to use for transcription (optional)
                language:
                  type: string
                  description: The language of the audio (optional, e.g. "en")
            example:
              file: "examples/golden.wav"
              model: "whisper-large-v3"
              language: "en"
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
              example:
                job_id: "job-12345"
                status: "queued"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "File exceeds maximum allowed size"
  /v1/jobs/{job_id}:
    get:
      summary: Get job status and result
      description: >-
        Returns the current status of a transcription job and, when done,
        the transcription result.
      operationId: getJobStatus
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The job ID returned when the job was created
      responses:
        "200":
          description: Job status and result (if done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              example:
                status: "done"
                result:
                  text: "Hello, world!"
                  segments:
                    - start: 0.0
                      end: 1.5
                      text: "Hello,"
                    - start: 1.5
                      end: 3.0
                      text: "world!"
                  language: "en"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "Job does not exist"
  /v1/auth/register:
    post:
      summary: Register a new account
      description: >-
        Register a new account. Never a password, never a DEK — the client
        derives the KEK and sends the verifier. First account = admin.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: "alice"
              salt: "c2FsdA=="
              kdf_params:
                memory: 64
                iterations: 3
                parallelism: 1
              kdf_version: 1
              auth_verifier: "dmVyaWZpZXI="
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                username: "alice"
                role: "admin"
        "400":
          description: Invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid_field"
                message: "kdf_params below floor"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "username_taken"
                message: "Username already registered"
  /v1/auth/salt:
    post:
      summary: Get account salt and KDF parameters
      description: >-
        Returns the salt and KDF parameters for an account. No decoy: an
        unknown username gets an honest "no such account".
      operationId: getSalt
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltRequest"
            example:
              username: "alice"
      responses:
        "200":
          description: Salt and KDF parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaltResponse"
              example:
                salt: "c2FsdA=="
                kdf_params:
                  memory: 64
                  iterations: 3
                  parallelism: 1
                kdf_version: 1
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "no_such_account"
                message: "No such account"
  /v1/auth/login:
    post:
      summary: Log in
      description: >-
        Log in with username and auth_verifier. Returns a session token and
        the account's wrapped keys (null together for a keyless account).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "alice"
              auth_verifier: "dmVyaWZpZXI="
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: "tok_abc123"
                role: "admin"
                wrapped_dek: null
                wrapped_box_privkey: null
                box_pubkey: null
                key_version: 0
                prev_wrapped_dek: null
                reset_at: null
                rekeyed_at: null
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid username or verifier"
  /v1/auth/logout:
    post:
      summary: Log out
      description: Revoke the presented session token.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
  /v1/admin/agent-tokens/{id}:
    delete:
      summary: Revoke an agent token
      description: >-
        Admin-only: revoke an agent token by id.
      operationId: revokeAgentToken
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The agent token id
      responses:
        "204":
          description: Token revoked
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "Agent token not found"
  /health:
    get:
      summary: Health check
      description: Returns the health status of the service.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: "ok"
                forwarding_to: "whisper-server:8080"
                uptime: "1h23m45s"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JobStatus:
      type: string
      enum:
        - queued
        - processing
        - done
        - failed
      description: >-
        The status of a transcription job. Named schema shared by Job and
        JobAccepted; JobAccepted.status narrows it to [queued].
    JobAccepted:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          description: The unique identifier for the job
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          enum:
            - queued
          description: >-
            The initial status of the job. The enum narrows the JobStatus
            values a 202 may carry to exactly [queued]; a job is accepted as
            queued and nothing else. The Kotlin side must be JobStatus with
            the same narrowing at construction.
    Job:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: The current status of the job
        result:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TranscriptionResult"
          description: The transcription result (null until status is "done")
        error:
          type: string
          nullable: true
          description: >-
            The failure reason; non-null exactly when status is "failed".
            This is the contract's failure-reason field: whisper-server
            surfaces failures as failed with a clear error, and the
            stt-server client reads it into SttResult.failure.
    TranscriptionResult:
      type: object
      required:
        - text
        - segments
        - language
      properties:
        text:
          type: string
          description: The full transcribed text
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
          description: The individual segments of the transcription
        language:
          type: string
          description: The detected or specified language
    Segment:
      type: object
      required:
        - start
        - end
        - text
      properties:
        start:
          type: number
          format: float
          description: Start time in seconds
        end:
          type: number
          format: float
          description: End time in seconds
        text:
          type: string
          description: The text of this segment
    Health:
      type: object
      required:
        - status
        - forwarding_to
        - uptime
      properties:
        status:
          type: string
          description: The health status ("ok", "degraded", etc.)
        forwarding_to:
          type: string
          description: The upstream service being forwarded to
        uptime:
          type: string
          description: How long the service has been running
    RegisterRequest:
      type: object
      required:
        - username
        - salt
        - kdf_params
        - kdf_version
        - auth_verifier
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username (ASCII [A-Za-z0-9._-], 1-64 chars)
        salt:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The salt, base64 padded, 32 bytes after decode
        kdf_params:
          $ref: "#/components/schemas/KdfParams"
        kdf_version:
          type: integer
          enum: [1]
          description: Must equal 1
        auth_verifier:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The auth verifier, base64 padded, 32 bytes after decode
    RegisterResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
          description: The account username
        role:
          type: string
          description: The account role ("admin" or "user")
    SaltRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username
    SaltResponse:
      type: object
      required:
        - salt
        - kdf_params
        - kdf_version
      properties:
        salt:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The salt, base64 padded, 32 bytes after decode
        kdf_params:
          $ref: "#/components/schemas/KdfParams"
        kdf_version:
          type: integer
          description: Must equal 1
    LoginRequest:
      type: object
      required:
        - username
        - auth_verifier
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username
        auth_verifier:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The auth verifier, base64 padded, 32 bytes after decode
    LoginResponse:
      type: object
      required:
        - token
        - role
        - key_version
      properties:
        token:
          type: string
          description: The session token
        role:
          type: string
          description: The account role ("admin" or "user")
        wrapped_dek:
          type: string
          nullable: true
          description: The wrapped DEK, base64 padded; null together with other key fields for a keyless account
        wrapped_box_privkey:
          type: string
          nullable: true
          description: The wrapped box private key, base64 padded; null together
        box_pubkey:
          type: string
          nullable: true
          description: The box public key, base64 padded; null together
        key_version:
          type: integer
          description: The account's current DEK generation; 0 before first bootstrap
        prev_wrapped_dek:
          type: string
          nullable: true
          description: The previous DEK wrapped with the current one; null unless re-key unfinished
        reset_at:
          type: string
          nullable: true
          description: The account's last-reset timestamp, or null
        rekeyed_at:
          type: string
          nullable: true
          description: The account's last-rekey timestamp, or null
    KdfParams:
      type: object
      required:
        - memory
        - iterations
        - parallelism
      properties:
        memory:
          type: integer
          minimum: 64
          maximum: 256
          description: Memory in MiB (64-256)
        iterations:
          type: integer
          minimum: 3
          maximum: 10
          description: Iterations (3-10)
        parallelism:
          type: integer
          minimum: 1
          maximum: 4
          description: Parallelism (1-4)
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: The error code
        message:
          type: string
          description: A human-readable error message
