        "403":
          description: Forbidden (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "Admin role required"
        "503":
          description: "A storage failure while the caller is checked or the switch is set or read back gets this answer. The body is fixed and no part of the failure is echoed."
