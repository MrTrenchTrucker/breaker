openapi: "3.0.3"
info:
  title: Breaker API — transcription-job contract (slice 1)
  description: >-
    The transcription-job contract: enqueue an audio transcription job, poll its
    status and result, and check service health. This is the single contract both
    the Android client (stt-server) and the server (whisper-server) implement.
    An operation marked `x-status: planned` is part of the contract but is not
    built yet: no server installs it.
  version: "1.0.0"
paths:
  /v1/audio/transcriptions:
    post:
      summary: Enqueue a transcription job
      description: >-
        Accepts an audio file and enqueues a transcription job. The job is
        processed asynchronously; poll GET /v1/jobs/{job_id} for the result.
      operationId: createTranscriptionJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file to transcribe (WAV, MP3, etc.)
                model:
                  type: string
                  description: The model to use for transcription (optional)
                language:
                  type: string
                  description: The language of the audio (optional, e.g. "en")
            example:
              file: "examples/golden.wav"
              model: "whisper-large-v3"
              language: "en"
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
              example:
                job_id: "12345"
                status: "queued"
        "400":
          description: The upload's audio file part is missing, or the part is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The example is the real 400 body (error only); Error schema message is not sent, as for 404.
              example:
                error: "the file part is required"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "File exceeds maximum allowed size"
        "429":
          description: >-
            Too many requests. Only agent tokens are limited, and only when the admin sets
            BREAKER_WHISPER_AGENT_RATE_LIMIT_PER_MIN: more requests than that number from one
            token inside a fixed 60 second window. Both routes share one counter per token. A
            token that fails the check is 401 first and is never counted. Retry-After says how
            long to wait.
          headers:
            Retry-After:
              description: Whole seconds left in the window, rounded up, minimum 1
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The example is the real 429 body (error only); Error schema message is not sent, as for 404.
              example:
                error: "rate limit exceeded"
        "500":
          description: The server could not read the multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The example is the real 500 body (error only); Error schema message is not sent, as for 404.
              example:
                error: "the upload could not be read"
        "503":
          description: "A failed token check (the token service cannot be reached) gets this answer, before the upload is read. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The example is the real 503 body (error only); Error schema message is not sent, as for 404.
              example:
                error: "unavailable"
  /v1/jobs/{job_id}:
    get:
      summary: Get job status and result
      description: >-
        Returns the current status of a transcription job and, when done,
        the transcription result.
      operationId: getJobStatus
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The job ID returned when the job was created; an opaque string the client echoes back unchanged and never parses (the server emits an opaque numeric-ish id).
      responses:
        "200":
          description: Job status and result (if done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              example:
                status: "done"
                result:
                  text: "Hello, world!"
                  segments:
                    - start: 0.0
                      end: 1.5
                      text: "Hello,"
                    - start: 1.5
                      end: 3.0
                      text: "world!"
                  language: "en"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "404":
          description: Job not found — the job_id is unknown, non-numeric, or its result has passed its TTL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The real 404 body is the single-field object {"error":"unknown or expired"}; it is valid
              # because the Error schema requires only `error` (`message` is optional).
              example:
                error: "unknown or expired"
                message: "The job id is unknown, or its result has passed its retention window"
        "503":
          description: "A failed token check (the token service cannot be reached) gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The example is the real 503 body (error only); Error schema message is not sent, as for 404.
              example:
                error: "unavailable"
        "429":
          description: >-
            Too many requests. Only agent tokens are limited, and only when the admin sets
            BREAKER_WHISPER_AGENT_RATE_LIMIT_PER_MIN: more requests than that number from one
            token inside a fixed 60 second window. Both routes share one counter per token. A
            token that fails the check is 401 first and is never counted. Retry-After says how
            long to wait.
          headers:
            Retry-After:
              description: Whole seconds left in the window, rounded up, minimum 1
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              # The example is the real 429 body (error only); Error schema message is not sent, as for 404.
              example:
                error: "rate limit exceeded"
  /v1/auth/register:
    post:
      summary: Register a new account
      description: >-
        Register a new account. Never a password, never a DEK — the client
        derives the KEK and sends the verifier. First account = admin.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: "alice"
              salt: "AAAAAAAAAAAAAAAAAAAAAA=="
              kdf_params:
                memory_kib: 65536
                iterations: 3
                parallelism: 1
              kdf_version: 1
              auth_verifier: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                username: "alice"
                role: "admin"
        "400":
          description: Invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid_field"
                message: "kdf_params below floor or salt length invalid"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "username_taken"
                message: "Username already registered"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure while the account is registered gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/salt:
    post:
      summary: Get account salt and KDF parameters
      description: >-
        Returns the salt and KDF parameters for an account. No decoy: an
        unknown username gets an honest "no such account".
      operationId: getSalt
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltRequest"
            example:
              username: "alice"
      responses:
        "200":
          description: Salt and KDF parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaltResponse"
              example:
                salt: "AAAAAAAAAAAAAAAAAAAAAA=="
                kdf_params:
                  memory_kib: 65536
                  iterations: 3
                  parallelism: 1
                kdf_version: 1
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "no_such_account"
                message: "No such account"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure while the salt is looked up gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/login:
    post:
      summary: Log in
      description: >-
        Log in with username and auth_verifier. Returns a session token and
        the account's wrapped keys (null together for a keyless account).
        Wrong tries are limited: five wrong passwords start a fifteen minute
        wait, on by default; an admin can turn it off with the wrong-pw-limit route.
        A plain 401 answers the fifth wrong try; from the sixth try inside the wait
        the answer is locked, 423 with Retry-After in seconds.

        The key fields, key_version, prev_wrapped_dek, reset_at and rekeyed_at
        come from the stored columns. The three key fields are the canonical
        padded base64 of the stored bytes and null together; key_version is the
        stored counter (0 for a keyless account, 1 after the first key upload);
        prev_wrapped_dek is null until the password change sets it, and null
        again once the previous-key rule clears it (see
        /v1/auth/change-password); reset_at and rekeyed_at are ISO-8601 UTC
        strings made from stored epoch milliseconds, always with exactly three
        fractional digits (2026-11-04T08:47:41.353Z, and a whole second prints
        2026-11-04T08:47:41.000Z), or null. rekeyed_at is set by the password
        change; reset_at is set by the admin reset (POST
        /v1/admin/reset-account) and is never cleared. The wire shape does not
        change.

        An account that waits for a reset to be completed (the admin reset
        marked it reset-pending) cannot log in: the answer is the same 401 as a
        wrong verifier, with the same body, no hash is run for it, and the try
        is not counted. Until the reset is completed (POST
        /v1/auth/complete-reset) no password opens it.

        A storage failure in the check of the credentials, in the read of the
        keys or in the issue of the session token gets the fixed 503, never a
        500.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "alice"
              auth_verifier: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: "tok_abc123"
                role: "admin"
                wrapped_dek: null
                wrapped_box_privkey: null
                box_pubkey: null
                key_version: 0
                prev_wrapped_dek: null
                reset_at: null
                rekeyed_at: null
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid username or verifier"
        "423":
          description: >-
            Sign-in is locked after five wrong passwords, for 15 minutes. The
            answer is the same for a known and an unknown username, and a right
            password inside the wait is refused with it too. Retry-After says
            how long to wait.
          headers:
            Retry-After:
              description: Whole seconds left in the wait, rounded up, minimum 1
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "locked"
                message: "Too many wrong tries. Try again in N minutes."
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure in the check of the credentials, the read of the keys or the issue of the session token gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/keys:
    post:
      summary: Upload the account's keys for the first time
      description: >-
        The first key upload: the client sends the
        account's wrapped DEK, its wrapped box private key and its box public
        key once, while the account has no keys yet. It needs a user session
        token. An agent token is refused (403, the same answer as /v1/sync);
        that check runs right after the token is resolved and before the body
        is read.

        The body is read with a cap of 4096 bytes (413, before it is
        parsed). It is one JSON object with exactly the three members
        wrapped_dek, wrapped_box_privkey and box_pubkey, each a string of
        standard base64 (RFC 4648, padded, no whitespace, no line wrap) that
        decodes to an exact length: 60 bytes (80 characters), 60 bytes (80
        characters) and 32 bytes (44 characters). The 60 bytes are the 12-byte
        nonce, the 32 encrypted key bytes and the 16-byte tag (AES-256-GCM, the
        same form as wrapped_dek). box_pubkey is the plain 32-byte public key.
        The server checks only the lengths and never opens the values. It
        stores the decoded bytes, and the login answer writes them back as
        canonical padded base64.

        The server stores the decoded bytes and re-encodes them, so a
        value whose last character carries spare bits is accepted and written
        back as the canonical text of the stored bytes.

        The order of the checks is: the token (401), the token kind
        (403), the size (413), the body (400 for malformed JSON, a body that is
        not an object, a missing, extra or non-string member, bad base64 or a
        wrong decoded length; nothing is written). Then, in one transaction,
        the call is accepted only while the account has no keys (a keyed
        account gets 409). It stores the three values and sets
        key_version to its previous value plus 1 (0 becomes 1 for the first
        upload). key_version never goes down. A failure inside the transaction
        leaves every column and key_version as they were.

        The call is also 409 while the account waits for a reset to be
        completed (the admin reset marked it reset-pending); the transaction
        reads that mark before it writes anything, and this refusal comes
        before the account-has-keys refusal because a reset account has no
        keys either and this is the message that says what to do. The body is
        still read first, so a bad body on a pending account is 400.

        The answer carries the new key_version, the same shape the
        password change uses. That is a choice of this contract (status
        200 with a body, not 204), so the client need not guess the counter.
        No part of the request is ever echoed.
      operationId: setKeys
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wrapped_dek
                - wrapped_box_privkey
                - box_pubkey
              additionalProperties: false
              properties:
                wrapped_dek:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{80}$"
                  minLength: 80
                  maxLength: 80
                  description: "The wrapped DEK, standard base64 padded, 80 characters that decode to exactly 60 bytes"
                wrapped_box_privkey:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{80}$"
                  minLength: 80
                  maxLength: 80
                  description: "The wrapped box private key, standard base64 padded, 80 characters that decode to exactly 60 bytes"
                box_pubkey:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{43}=$"
                  minLength: 44
                  maxLength: 44
                  description: "The box public key, plain, standard base64 padded, 44 characters that decode to exactly 32 bytes"
            example:
              wrapped_dek: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              wrapped_box_privkey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              box_pubkey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      responses:
        "200":
          description: "Keys stored. The body carries the new key_version."
          content:
            application/json:
              schema:
                type: object
                required:
                  - key_version
                properties:
                  key_version:
                    type: integer
                    minimum: 1
                    description: "The account's new key_version (its previous value plus 1)"
              example:
                key_version: 1
        "400":
          description: >-
            Bad request. The body is not one JSON object with exactly
            the three members, a member is not a string, a value is not
            standard padded base64, or a decoded length is wrong. Nothing is
            written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Invalid request body"
        "401":
          description: "Missing, unknown, revoked or expired user session token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: "Forbidden - a valid token of the wrong kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "409":
          description: >-
            Conflict. The account already has keys (message "The account
            already has keys"). Nothing is written. The call is also refused
            while the account waits for a reset to be completed (message "The
            account is waiting for a reset to be completed"), and that message
            comes first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "conflict"
                message: "The account already has keys"
        "413":
          description: "Request entity too large. The body is over 4096 bytes and is refused before it is parsed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure or a failed session check gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/change-password:
    post:
      summary: Change the password and re-key the account
      description: >-
        The signed-in person changes the password. Every
        call re-keys: it replaces the wrapped DEK, the wrapped box private key
        and the box public key, and moves key_version up by exactly one. It
        needs a user session token; an agent token is refused (403, the same
        answer as /v1/sync) before the body is read.

        The order of the checks is: the token (401 for a missing, unknown,
        revoked or expired token; 503 when the token check itself fails), the
        token kind (403), the reset-pending mark (409, read before the body, so
        a bad body on a pending account is 409 and no wrong try is counted),
        the size (413, cap 4096 bytes, before the body is
        parsed), the body (400 for malformed JSON, a missing, extra, duplicate
        or wrongly typed member, or a value that is not standard padded
        base64), and the decoded lengths (400, before any write):
        old_auth_verifier 32 bytes, new_salt 16 bytes, new_auth_verifier 32
        bytes, new_wrapped_dek 60 bytes, new_wrapped_box_privkey 60 bytes,
        new_box_pubkey 32 bytes and prev_wrapped_dek 60 bytes.
        new_kdf_params must be inside the bounds of KdfParams, new_kdf_version
        must be 1 and new_key_version must be at least 1.

        old_auth_verifier re-proves the current password through the same path
        as login. A wrong one counts as a wrong try and gets 401 with the
        message "Invalid old verifier"; one that is not base64 or not 32 bytes
        is a 400 and does not count. A locked name gets the locked answer (423
        with Retry-After in whole seconds). A signed-in session keeps working
        (sync, sign-out) while the name is locked; changing the password needs
        the name unlocked.

        prev_wrapped_dek is required: it is the OLD DEK wrapped with the NEW
        DEK, exactly 60 bytes, and the server stores it as sent. The server
        never moves the old wrapped DEK itself.

        Then one transaction makes all the effects or none. Inside it the
        session token is read again and must still be live. It answers 409
        while the account waits for a reset to be completed (the mark is read
        again inside the transaction), when the account has no keys, when
        new_key_version is not exactly the account's current key_version plus
        one, or while the account still holds a prev_wrapped_dek from an
        unfinished re-key; when more than one applies, that is the order of
        the messages (the pending message is first, because a reset account has
        no keys either and this is the one that says what to do). On success
        it stores the new salt, KDF values, verifier and keys, sets key_version
        and sets rekeyed_at to the time of the change; it revokes every other
        user session token of the account and ends the account's unredeemed
        sign-in codes (the presented token and all agent tokens are kept);
        it clears the wrong-password row; and it answers 200 with the new
        key_version. A session token that is revoked or expired before the
        transaction commits (for example by an admin reset running at the same
        time) gets the 401 of an invalid token.

        The previous-key rule runs in the same transaction, right after the
        write: prev_wrapped_dek is set to null again when no stored
        transcription of the account that is not deleted has a key_version
        below the account's key_version, so an account with no old rows is
        cleared at once. The same rule runs, in the same transaction, after a
        POST /v1/sync that replaces a row and after a DELETE of a
        transcription.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_auth_verifier
                - new_salt
                - new_kdf_params
                - new_kdf_version
                - new_wrapped_dek
                - new_wrapped_box_privkey
                - new_box_pubkey
                - new_auth_verifier
                - new_key_version
                - prev_wrapped_dek
              additionalProperties: false
              properties:
                old_auth_verifier:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{43}=$"
                  description: "The current auth verifier, base64 padded, 32 bytes after decode"
                new_salt:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{22}==$"
                  description: "The new salt, base64 padded, 16 bytes after decode"
                new_kdf_params:
                  $ref: "#/components/schemas/KdfParams"
                new_kdf_version:
                  type: integer
                  enum: [1]
                  description: "Must equal 1"
                new_wrapped_dek:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{80}$"
                  description: "The new wrapped DEK, standard base64 padded, 60 bytes after decode"
                new_wrapped_box_privkey:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{80}$"
                  description: "The new wrapped box private key, standard base64 padded, 60 bytes after decode"
                new_box_pubkey:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{43}=$"
                  description: "The new box public key, plain, standard base64 padded, 32 bytes after decode"
                new_auth_verifier:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{43}=$"
                  description: "The new auth verifier, base64 padded, 32 bytes after decode"
                new_key_version:
                  type: integer
                  minimum: 1
                  description: "The account's current key_version plus one"
                prev_wrapped_dek:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{80}$"
                  description: "The OLD DEK wrapped with the NEW DEK, standard base64 padded, 60 bytes after decode. Required."
            example:
              old_auth_verifier: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
              new_salt: "AAAAAAAAAAAAAAAAAAAAAA=="
              new_kdf_params:
                memory_kib: 65536
                iterations: 3
                parallelism: 1
              new_kdf_version: 1
              new_wrapped_dek: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              new_wrapped_box_privkey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              new_box_pubkey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
              new_auth_verifier: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
              new_key_version: 2
              prev_wrapped_dek: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      responses:
        "200":
          description: "Password changed. The body carries the new key_version."
          content:
            application/json:
              schema:
                type: object
                required:
                  - key_version
                properties:
                  key_version:
                    type: integer
                    minimum: 1
                    description: "The account's new key_version (its previous value plus 1)"
              example:
                key_version: 2
        "400":
          description: "Bad request. The body or a decoded length is wrong, including an old verifier that is not base64 or not 32 bytes (not counted as a wrong try). Nothing is written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Invalid request body"
        "401":
          description: >-
            Refused. A missing, unknown, revoked or expired token gets the
            message in the example. A session token that is revoked before the
            transaction commits (for example by an admin reset running at the
            same time) gets the same 401, error "unauthorized", message "Invalid
            or missing user session token". A wrong old verifier gets error
            "unauthorized" with the message "Invalid old verifier".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: "Forbidden - a valid token of the wrong kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "409":
          description: >-
            Conflict. The message is "The account is waiting for a reset to be
            completed" for an account that waits for a reset, or "The account
            has no keys" for an account without keys, or "key_version is not
            the account's current key_version plus one", or "A previous re-key
            is unfinished" while the account holds a prev_wrapped_dek; when
            more than one applies, the first of these in this order is the one
            given. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "conflict"
                message: "key_version is not the account's current key_version plus one"
        "413":
          description: "Request entity too large. The body is over 4096 bytes and is refused before it is parsed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "423":
          description: >-
            Sign-in is locked after five wrong passwords, for 15
            minutes. The same answer as login. Retry-After says how long to
            wait.
          headers:
            Retry-After:
              description: "Seconds left in the wait, a whole number counted up to the next second, minimum 1"
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "locked"
                message: "Too many wrong tries. Try again in N minutes."
        "503":
          description: "A storage failure or a failed session check gets this answer, also a failure while the old verifier is checked or hashed. The body is fixed and no part of the failure is echoed. The account's keys and password are not changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/complete-reset:
    post:
      summary: Finish an admin reset with the one-time reset code
      description: >-
        After an admin reset (POST /v1/admin/reset-account) the person chooses
        a new password with the one-time reset code. No token is needed: the
        reset already revoked every token of the account. The Authorization
        header is read only to refuse an agent token: a header that resolves to
        an agent token gets 403 (the same answer as /v1/sync) before the body
        is read, and any other header is ignored (a session token sent here is
        not used and its expiry does not move).

        The order of the checks is: the token kind (403), the size (413, cap
        4096 bytes, before the body is parsed), the body (400 for a malformed
        body: exactly the six members, each once, kdf_params with exactly its
        three whole-number members, every text member a JSON string; only the
        shape and the types are checked here), then the lookups: the username
        is valid and folds to lower case, the account waits for a reset, a live
        unexpired code exists, and the constant-time compare of the stored hash
        of the code matches. Every one of these failures is the same fixed 401
        with the message "Invalid username or reset code": an unknown or
        malformed name, an unknown, malformed, wrong, used or expired code, and
        an account that is not waiting for a reset. After that, and only after
        a right name and code, the salt (24 characters of standard padded
        base64, 16 bytes), the KDF floor, ceiling and version (1), and the
        verifier (44 characters, 32 bytes) are checked (400, nothing written).

        On success, one transaction deletes the code (a code is single use:
        of two completions with one code only one succeeds), stores the new
        salt, verifier and KDF fields, clears the reset-pending mark, clears the
        wrong-password row and mints a session token. The answer is 200 with
        the LoginResponse body: the key fields are null (the account is
        keyless), key_version is unchanged and reset_at is set. A POST
        /v1/auth/keys follows. A locked name does not block a right code.

        There is no attempt counter on this route: the code is 256 random
        bits. A wrong code does not touch the wrong-password row. Known limit:
        whoever presents the code first chooses the password (ADR-018).

        The reset code and the request body are never logged. A storage
        failure, also in the check of an Authorization header, gets the fixed
        503.
      operationId: completeReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - reset_code
                - salt
                - kdf_params
                - kdf_version
                - auth_verifier
              additionalProperties: false
              properties:
                username:
                  type: string
                  pattern: "^[A-Za-z0-9._-]{1,64}$"
                  description: "The account username"
                reset_code:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{43}$"
                  description: "The one-time reset code, 43 URL-safe characters (256 random bits)"
                salt:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{22}==$"
                  description: "The new salt, base64 padded, 16 bytes after decode"
                kdf_params:
                  $ref: "#/components/schemas/KdfParams"
                kdf_version:
                  type: integer
                  enum: [1]
                  description: "Must equal 1"
                auth_verifier:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{43}=$"
                  description: "The new auth verifier, base64 padded, 32 bytes after decode"
            example:
              username: "alice"
              reset_code: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              salt: "AAAAAAAAAAAAAAAAAAAAAA=="
              kdf_params:
                memory_kib: 65536
                iterations: 3
                parallelism: 1
              kdf_version: 1
              auth_verifier: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      responses:
        "200":
          description: "Reset completed. The body is the login answer, keyless, with reset_at set. The token member is the new session token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "Bad request. The body is malformed, the KDF values are outside the bounds, the salt is not 16 bytes, or the verifier is not 32 bytes. The salt, KDF and verifier checks come only after a right name and code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Invalid request body"
        "401":
          description: >-
            Refused. One fixed answer for an unknown username, an account that
            is not waiting for a reset, and an unknown, malformed, wrong, used
            or expired code: the same status and the same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid username or reset code"
        "403":
          description: "Forbidden - the presented token is an agent token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "413":
          description: "Request entity too large. The body is over 4096 bytes and is refused before it is parsed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/logout:
    post:
      summary: Log out
      description: Revoke the presented session token.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "503":
          description: "A storage failure while the session token is checked or revoked gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/handoff/start:
    post:
      summary: Start a sign-in hand-off
      description: >-
        Called by the website page, with the session token of the signed-in
        user, to create a one-time sign-in code for the app. An agent token is
        refused (403, the same answer as /v1/sync). The body holds exactly two
        keys, challenge and sealed_package. The challenge is the SHA-256 of
        the app's secret text, written as 43 URL-safe characters; the server
        checks it by shape only. The sealed package is the account's keys
        sealed to the app's public key, exactly 113 bytes written as standard
        base64 (152 characters); the server stores it without opening it and
        checks only its length. The answer holds the code.

        The code is valid for 5 minutes from this call and can be used once.
        It is 43 characters of letters, digits, hyphen and underscore, so it
        can go into a breaker:// link with no escaping. An account has at most
        5 live codes: a sixth start ends the oldest live code and removes its
        package. This call has no effect on the person's own session.
      operationId: handoffStart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffStartRequest"
            example:
              challenge: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              sealed_package: "ZXhhbXBsZSBzZWFsZWQgcGFja2FnZSwgbm90IGEgcmVhbCBrZXkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      responses:
        "201":
          description: Code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffStartResponse"
              example:
                code: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        "400":
          description: >-
            Bad request. The body is not one JSON object with exactly the two
            keys challenge and sealed_package, or a value breaks its pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Invalid request body"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure while the token is checked or the hand-off is stored gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/handoff/exchange:
    post:
      summary: Trade a sign-in code for a session
      description: >-
        Called by the app. No token is sent: the code and the secret are the
        credential. The server hashes the secret and compares it with the
        challenge stored at start. On success the code is used up and the
        stored package is deleted in the same step, and the sealed package
        comes back once, in this answer only. The session is an ordinary
        session that ends 30 days after its last use, and it carries the
        device name if one was sent. No password and no plaintext key is ever
        in this answer.

        Every failure of the code or the secret gets one answer. The status is
        401 and the body is the same, byte for byte, for an unknown code, a
        code or secret of the wrong length or alphabet, a wrong secret, an
        expired code and a code already used. No other status tells these
        cases apart. A second exchange with the same code gets this 401. A
        wrong secret does not use up the code, and neither does a 400.
      operationId: handoffExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffExchangeRequest"
            example:
              code: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              secret: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              device_name: "Pixel 8"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffExchangeResponse"
              example:
                token: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                role: "user"
                key_version: 0
                sealed_package: "ZXhhbXBsZSBzZWFsZWQgcGFja2FnZSwgbm90IGEgcmVhbCBrZXkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
                username: "alice"
                account_id: 1
        "400":
          description: >-
            Bad request. The body is not one JSON object with the keys code,
            secret and optionally device_name, or device_name is present, is
            not null, and is not a string of 1 to 64 characters.
            A 400 does not use up the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Invalid request body"
        "401":
          description: >-
            Refused. This is the one answer for every failure of the code or
            the secret: an unknown code, a code or secret of the wrong length
            or alphabet, a wrong secret, an expired code and a code already
            used. The body is the same, byte for byte, and no other status
            tells these cases apart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid sign-in code or secret"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "payload_too_large"
                message: "Request body exceeds maximum allowed size"
        "503":
          description: "A storage failure while the code is redeemed gets this answer. The body is fixed and no part of the failure is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/auth/devices:
    get:
      summary: List the live sessions of the caller's account
      description: >-
        A user session lists the live sessions of its own account: not
        signed out, not expired, inside the 180 day cap. At most 50 rows,
        the 50 newest by id, listed oldest first. last_seen is the session
        expiry minus 30 days and never before the creation time. current
        marks the calling session. An agent token is refused with 403.
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The live sessions of the caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
              example:
                devices:
                  - id: 4
                    name: "Pixel 8"
                    last_seen: "2026-11-07T12:00:05.250Z"
                    current: true
        "401":
          description: Refused with no, bad or dead user session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Refused. A valid token of the wrong kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "503":
          description: A storage failure gets this fixed answer, with no part of the failure echoed.
          content:
