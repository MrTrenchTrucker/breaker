  /v1/transcriptions:
    get:
      summary: Pull the account's transcriptions
      description: >-
        Pull the authenticated account's transcriptions, each with its own
        key_version so a client can tell which of its own rows still need
        replacing after an interrupted migration or re-key. One page per
        answer: at most 100 items and at most 4 MiB of text, and one record
        always fits. There is NO limit parameter. The client repeats with
        since = next while more is true. No since = live rows only (first
        page, next = head cursor). since = <account>-0 means nothing seen
        yet. A list longer than one page returns a list cursor as `next`;
        the final page returns an incremental cursor. A cursor above the head
        answers 200 with empty items and next = head. A malformed cursor or
        a cursor of another account = 400 (checked before anything is read).
        A list cursor whose position is 0 or not below its head is 400. A cursor below
        the purged floor = 410; a list cursor is never refused with 410. A
        delete record has client_id, change, deleted true and stored_at only.
        On a list cursor the final page returns an incremental cursor at the
        first-page head, not the head now, so a delete made between two pages
        is still reported. A list is a snapshot at the first-page head: it reads only
        live rows up to that head, and rows written after it reach the client through
        the next incremental pull.
      operationId: listTranscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{1,19}-[0-9]{1,19}(-[0-9]{1,19})?$"
          description: >
            Cursor `<account_id>-<change>` returned in a previous `next`.
            Missing = full live list; `<account>-0` = nothing seen yet. A page of a list
            longer than one page returns a list cursor `<account_id>-<position>-<head>`:
            send it back unchanged.
      responses:
        "200":
          description: >
            The account's transcription records as one page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPage"
              example:
                items:
                  - client_id: "0f9c4d1e-6a2b-4c3d-9e8f-1a2b3c4d5e6f"
                    change: 7
                    deleted: false
                    key_version: 0
                    encrypted: "eyJ2IjoxLCJ0ZXh0IjoiaGVsbG8gZnJvbSB0aGUgcGhvbmUiLCJzb3VyY2UiOiJsb2NhbCIsIm1vZGVsIjoiYmFzZS5lbiIsImR1cmF0aW9uX21zIjoxNTAwLCJjcmVhdGVkX2F0IjoiMjAyNi0xMC0xMVQxMjowMDowMC4wMDBaIn0="
                    stored_at: "2026-10-11T12:00:05.000Z"
                next: "7-42"
                more: true
        "400":
          description: >-
            Bad `since` cursor: not matching the pattern, or a cursor of another account.
            A list cursor whose position is 0 or not below its head is 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "The cursor is invalid: check its account tag and pattern"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "410":
          description: >-
            The cursor is below the account's purged floor. An admin reset
            (POST /v1/admin/reset-account) sets the floor to the account's new
            change number, so after a reset every earlier cursor gets 410, also
            a cursor at the old head and the cursor 0; the client lists again
            without since. The page that answers that list carries a next
            cursor that is not below the floor, so it is accepted. A list
            cursor is never refused with 410; a list reads live rows only, so
            purged_through is irrelevant to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "gone"
                message: "The cursor is too old: list again without since"
        "503":
          description: A storage failure, a stored time that cannot be formatted, or a failed session check gets this answer. The body is fixed and no part of the failure is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/transcriptions/{client_id}:
    delete:
      summary: Delete a transcription
      description: >-
        Delete a transcription by client id. An applied delete takes a new
        change number, clears the body and sets deleted (the row keeps its id
        and client id). A repeat or unknown delete writes nothing and takes no
        change number. The delete carries no key_version. A delete record
        shows up to other devices only as a delete record in GET.
      operationId: deleteTranscription
      security:
        - bearerAuth: []
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The transcription's client id, a lowercase canonical UUID (8-4-4-4-12 lowercase hex digits with hyphens)
      responses:
        "204":
          description: Deleted (applied, repeat, or unknown delete all answer 204; no content body)
        "400":
          description: >-
            Bad request. The client id is not a lowercase canonical UUID. The
            message names the rule and never echoes the input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "client id is not a lowercase canonical UUID"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
        "503":
          description: A storage failure or a failed session check gets this answer. The body is fixed and no part of the failure is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /v1/sync/pending-sealed:
    get:
      summary: List the owner's still-sealed results
      description: >-
        The authenticated owner's still-sealed agent-token job results: a
        list of sealed boxes. The owner's client unseals each with its box
        private key and re-uploads it via POST /v1/sync with client_id =
        that record's id at the account's current key_version (a new record,
        not a replace); the server deletes the pending record once a synced
        transcription with that client id lands. Honest limit: this endpoint
        returns whatever the pending-sealed store holds; it has no way to
        tell a sealed box whisper-server actually produced from one a
        database writer inserted directly - both are equally well-formed
        crypto_box_seal output, and the owner's client converts either kind
        the same way.
      operationId: listPendingSealed
      x-status: planned
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The owner's pending-sealed records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSealed"
              example:
                - id: "3b2c9f0a-7d4e-4a1b-8c5d-6e7f8091a2b3"
                  sealed_box: "cmVwbGFjZS13aXRoLXNhbXBsZS1zZWFsZWQtYm94"
                  created_at: "2026-10-11T12:00:00Z"
        "401":
          description: Missing or invalid user session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "Invalid or missing user session token"
        "403":
          description: Forbidden - a valid token of the wrong kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "User session token required; an agent token is refused"
  /v1/updates/latest.json:
    get:
      summary: Get the latest update manifest
      description: >-
        Returns the latest signed update manifest. Auth is an open item
        of ADR-011.
      operationId: getUpdateManifest
      responses:
        "200":
          description: The latest update manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateManifest"
              example:
                version: "0.0.0.1"
                version_code: 2
                apk_url: "https://example.com/app.apk"
                sha256: "the sha256 of the APK"
                signature: "the signature of the APK"
                notes: "Latest release"
        "404":
          description: No release yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "No release yet"
        "503":
          description: "The manifest file is there but unusable (a folder, too large, not UTF-8, not the six fields). The body is fixed and no part of the file is echoed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unavailable"
                message: "The service is unavailable, try again later"
  /health:
    get:
      summary: Health check
      description: Returns the health status of the service.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: "ok"
                forwarding_to: "whisper-server:8080"
                uptime: "1h23m45s"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JobStatus:
      type: string
      enum:
        - queued
        - processing
        - done
        - failed
      description: >-
        The status of a transcription job. Named schema shared by Job and
        JobAccepted; JobAccepted.status narrows it to [queued].
    JobAccepted:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          description: The unique identifier for the job
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          enum:
            - queued
          description: >-
            The initial status of the job. The enum narrows the JobStatus
            values a 202 may carry to exactly [queued]; a job is accepted as
            queued and nothing else. The Kotlin side must be JobStatus with
            the same narrowing at construction.
    Job:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: The current status of the job
        result:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TranscriptionResult"
          description: The transcription result (null until status is "done")
        error:
          type: string
          nullable: true
          description: >-
            The failure reason; non-null exactly when status is "failed".
            This is the contract's failure-reason field: whisper-server
            surfaces failures as failed with a clear error, and the
            stt-server client reads it into SttResult.failure.
    TranscriptionResult:
      type: object
      required:
        - text
        - segments
        - language
      properties:
        text:
          type: string
          description: The full transcribed text
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
          description: The individual segments of the transcription
        language:
          type: string
          description: The detected or specified language; empty when the service reported none
    Segment:
      type: object
      required:
        - start
        - end
        - text
      properties:
        start:
          type: number
          format: float
          description: Start time in seconds
        end:
          type: number
          format: float
          description: End time in seconds
        text:
          type: string
          description: The text of this segment
    Health:
      type: object
      description: >-
        The body both servers satisfy: `status` is required. A server may add the
        optional fields below (whisper-server sends both).
      required:
        - status
      additionalProperties: true
      properties:
        status:
          type: string
          description: The health status ("ok", "degraded", etc.)
        forwarding_to:
          type: string
          description: Optional. The upstream service being forwarded to
        uptime:
          type: string
          description: Optional. How long the service has been running
    RegisterRequest:
      type: object
      required:
        - username
        - salt
        - kdf_params
        - kdf_version
        - auth_verifier
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username (ASCII [A-Za-z0-9._-], 1-64 chars)
        salt:
          type: string
          pattern: "^[A-Za-z0-9+/]{22}==$"
          description: The salt, base64 padded, 16 bytes after decode
        kdf_params:
          $ref: "#/components/schemas/KdfParams"
        kdf_version:
          type: integer
          enum: [1]
          description: Must equal 1
        auth_verifier:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The auth verifier, base64 padded, 32 bytes after decode
    RegisterResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
          description: The account username
        role:
          type: string
          description: The account role ("admin" or "user")
    SaltRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username
    SaltResponse:
      type: object
      required:
        - salt
        - kdf_params
        - kdf_version
      properties:
        salt:
          type: string
          pattern: "^[A-Za-z0-9+/]{22}==$"
          description: The salt, base64 padded, 16 bytes after decode
        kdf_params:
          $ref: "#/components/schemas/KdfParams"
        kdf_version:
          type: integer
          description: Must equal 1
    LoginRequest:
      type: object
      required:
        - username
        - auth_verifier
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: The account username
        auth_verifier:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: The auth verifier, base64 padded, 32 bytes after decode
    LoginResponse:
      type: object
      required:
        - token
        - role
        - key_version
      properties:
        token:
          type: string
          description: The session token
        role:
          type: string
          description: The account role ("admin" or "user")
        wrapped_dek:
          type: string
          nullable: true
          description: The wrapped DEK, base64 padded; null together with other key fields for a keyless account
        wrapped_box_privkey:
          type: string
          nullable: true
          description: The wrapped box private key, base64 padded; null together
        box_pubkey:
          type: string
          nullable: true
          description: The box public key, base64 padded; null together
        key_version:
          type: integer
          description: The account's current DEK generation; 0 before first bootstrap
        prev_wrapped_dek:
          type: string
          nullable: true
          description: The previous DEK wrapped with the current one; null unless re-key unfinished
        reset_at:
          type: string
          nullable: true
          description: The account's last-reset timestamp, or null
        rekeyed_at:
          type: string
          nullable: true
          description: The account's last-rekey timestamp, or null
    KdfParams:
      type: object
      required:
        - memory_kib
        - iterations
        - parallelism
      properties:
        memory_kib:
          type: integer
          minimum: 65536
          maximum: 262144
          description: Memory in KiB (65536-262144)
        iterations:
          type: integer
          minimum: 3
          maximum: 10
          description: Iterations (3-10)
        parallelism:
          type: integer
          minimum: 1
          maximum: 4
          description: Parallelism (1-4)
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: The error code
        message:
          type: string
          description: Optional human-readable detail; absent when the server sends only the error code
    DeviceList:
      type: object
      required:
        - devices
      additionalProperties: false
      properties:
        devices:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DeviceRow"
    DeviceRow:
      type: object
      required:
        - id
        - last_seen
        - current
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
        last_seen:
          type: string
        current:
          type: boolean
    HandoffStartRequest:
      type: object
      required:
        - challenge
        - sealed_package
      properties:
        challenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: >-
            The SHA-256 of the app's secret text, written as 43 URL-safe
            characters (letters, digits, hyphen, underscore) with no padding
        sealed_package:
          type: string
          pattern: "^[A-Za-z0-9+/]{151}=$"
          minLength: 152
          maxLength: 152
          description: >-
            The sealed key package, standard base64 with one equals sign of
            padding, 152 characters that decode to exactly 113 bytes (65 + 48).
            The server stores it without opening it
    HandoffStartResponse:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: >-
            The one-time sign-in code, 43 characters of letters, digits,
            hyphen and underscore, so it needs no escaping in a link
    HandoffExchangeRequest:
      type: object
      required:
        - code
        - secret
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: The sign-in code from the start answer, 43 URL-safe characters
        secret:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: The app's secret text, 43 URL-safe characters
        device_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: >-
            Optional name of the device. It may be left out or sent as null,
            and both mean no name. When it is a string it is 1 to 64
            characters, kept as sent with no trimming
    HandoffExchangeResponse:
      type: object
      required:
        - token
        - role
        - key_version
        - sealed_package
        - username
        - account_id
      properties:
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: The session token, 43 URL-safe characters
        role:
          type: string
          description: The account role ("admin" or "user")
        key_version:
          type: integer
          minimum: 0
          description: The account's current DEK generation; 0 before first bootstrap
        sealed_package:
          type: string
          pattern: "^[A-Za-z0-9+/]{151}=$"
          minLength: 152
          maxLength: 152
          description: >-
            The sealed key package, carrying the same bytes the start stored, standard base64
            of 113 bytes (152 characters). It comes back once, in this answer
            only
        username:
          type: string
          description: The account username
        account_id:
          type: integer
          format: int64
          description: The account id
    SyncPush:
      type: object
      required:
        - client_id
        - key_version
        - encrypted
      properties:
        client_id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The transcription's client id, a lowercase canonical UUID (8-4-4-4-12 lowercase hex digits with hyphens)
        key_version:
          type: integer
          minimum: 0
          description: The account's DEK generation the encrypted body was sealed under (0 before the first bootstrap, and 0 means no cryptography, see encrypted)
        encrypted:
          type: string
          description: >-
            At key_version 0 this is the standard base64 (RFC 4648, padded, no
            line wrap) of the R1 body described in the /v1/sync operation, and
            no cryptography is applied: a key_version 0 body is development-only
            until Phase 19. At key_version 1 or higher it is the Phase 19 form,
            which is not built.
        resave:
          type: boolean
          description: "The re-save mark: absent or false means no mark; true means the mark (first push of an id the phone itself deleted, never a retry). The server parser reads this field."
    TranscriptionPage:
      type: object
      required:
        - items
        - next
        - more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionRecord"
        next:
          type: string
          pattern: "^[0-9]{1,19}-[0-9]{1,19}(-[0-9]{1,19})?$"
          description: Cursor string for the next page of results; always matches the cursor pattern and is never empty; when more is true it points at the head or the change of the last row scanned
        more:
          type: boolean
          description: True when more records are available beyond this page; the client repeats with since=next
    TranscriptionRecord:
      type: object
      required:
        - client_id
        - change
        - deleted
        - stored_at
      properties:
        client_id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The transcription's client id, a lowercase canonical UUID (8-4-4-4-12 lowercase hex digits with hyphens)
        change:
          type: integer
          format: int64
          minimum: 1
          description: "The change number this row carries; every record carries its change"
        deleted:
          type: boolean
          description: "true when this record is a delete record; false for a live row"
        key_version:
          type: integer
          minimum: 0
          description: The key_version this row was stored under; present on live rows, absent on delete records
        encrypted:
          type: string
          description: >-
            At key_version 0 this is the standard base64 (RFC 4648, padded, no
            line wrap) of the R1 body described in the /v1/sync operation, and
            no cryptography is applied: a key_version 0 body is development-only
            until Phase 19. At key_version 1 or higher it is the Phase 19 form,
            which is not built. Absent on delete records.
        stored_at:
          type: string
          description: When the server stored the row (UTC, always three millisecond digits, same form as created_at); for a delete record, the time of the delete write
      description: "A live record has client_id, change, deleted false, key_version, encrypted and stored_at. A delete record has client_id, change, deleted true and stored_at, and no key_version and no encrypted; key_version and encrypted are required when deleted is false and absent when deleted is true."
    PendingSealed:
      type: object
      required:
        - id
        - sealed_box
        - created_at
      properties:
        id:
          type: string
          description: The client id the re-upload must carry (the transcription this sealed box will become)
        sealed_box:
          type: string
          description: The sealed box (crypto_box_seal output), base64
        created_at:
          type: string
          description: When the box was sealed (RFC 3339)

    AgentTokenScope:
      type: string
      enum:
        - transcribe
        - admin
      description: >-
        The token's scope. `transcribe` lets it call the transcription
        endpoints, `admin` additionally the admin group.
    AgentTokenCreateRequest:
      type: object
      required:
        - name
        - owner_username
      properties:
        name:
          type: string
        owner_username:
          type: string
        scope:
          allOf:
            - $ref: "#/components/schemas/AgentTokenScope"
          nullable: true
          default: transcribe
          description: the token's scope; defaults to transcribe
        expires_at:
          type: string
          nullable: true
          description: null for no expiry
    AgentToken:
      type: object
      required:
        - token
        - name
        - owner_username
        - scope
      properties:
        token:
          type: string
          description: the token value, returned only here, never again
        name:
          type: string
        owner_username:
          type: string
        scope:
          $ref: "#/components/schemas/AgentTokenScope"
        expires_at:
          type: string
          nullable: true
    AgentTokenEntry:
      type: object
      required:
        - id
        - name
        - owner_username
        - scope
      properties:
        id:
          type: integer
          format: int64
          description: the token id, the value the revoke path's {id} takes
        name:
          type: string
        owner_username:
          type: string
        scope:
          $ref: "#/components/schemas/AgentTokenScope"
