      positional-embedding constants, the same class the small entry records.
      License: the weights' source repository (openai/whisper) licenses its
      code and model weights under MIT (LICENSE file; README "License"
      section); OpenAI's Hugging Face model cards tag the weights apache-2.0;
      both statements are permissive, and the registry records the
      repository's licence.
