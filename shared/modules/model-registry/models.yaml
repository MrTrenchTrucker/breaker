    size_bytes: 15667804
    asset_id: 191975328
    notes: >-
      A keyword spotter (open vocabulary, English, BPE tokens, one stream at a
      time), the mobile build of the 2024-01-01 model, released in the
      kws-models release. The app does not download or load it yet. params 3.3M
      is only the number in the upstream model name, not a count measured here.
      size_mb 15 is the MiB rounding of 15,667,804 bytes (14.94 MiB). The model
      README states Apache License 2.0. No upstream source revision is recorded
      for this entry, so upstream_commit is left out rather than invented, and
      tamper_verified is false: the tamper test has not been run on its real
      archive. Provenance is weaker than the speech entries: the archive's
      sha256 was downloaded and hashed and equals the line of the release's
      checksum.txt (asset 761308399), but that checksum.txt asset was uploaded
      or updated on 2026-11-18, years after the model asset (updated
      2024-09-11), so it is a weaker witness than the upstream file the speech
      entries are checked against. Details in
      fixtures/upstream-checksum-excerpt.txt.
