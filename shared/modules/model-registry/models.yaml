    family: sherpa-onnx
    params: 3.3M
    size_mb: 15
    url: https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/assets/191975328
    sha256: 2e6ac2577310bfa2f4b6b5fab0478b868c9d0b2cb2c51b3e13b50581b588864d
