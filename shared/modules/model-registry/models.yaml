    notes: >-
      NVIDIA's Parakeet TDT 0.6B v3, int8, packaged by upstream as an offline
      NeMo transducer: it decodes a whole take once, after the user stops.
      The sha256 is our own pin: it was computed over the downloaded archive
      (487,211,443 bytes) and it equals the digest the GitHub release API
      reports for the asset. Upstream publishes no checksum.txt line for this
      archive, so there is no fixture line to pair it with and the generator
      accepts the missing line for this archive name only. upstream_commit is
      left out rather than invented, and tamper_verified is false: the tamper
      test has not been run on its real archive (true means that test was run
      against the entry and watched refusing a corrupted copy). params 600M is
      the number in the model's name, not a count measured here. size_mb 465 is
      the MiB rounding of 487,211,443 bytes (464.6 MiB). The model is licensed
      CC BY 4.0, which asks for attribution: the attribution text is the
      `notice` field of this entry, and the About screen that shows it is
      built, unit-tested, not tried on a phone, in the app and not in this registry. The id
      parakeet can be chosen in the settings file, because the settings
      check reads this registry, and the wiring written for it installs and
      loads it, with its own extraction profile and an offline engine built
      behind the existing recogniser: all of that is built, unit-tested, not tried on a phone.
      The first-run and settings screens offer it.
      The offline library names the engine uses compile against the library in the project's CI build, and the
      offline engine has not been run on a device.

# Keyword-spotting models. An id may hold single hyphens here (the generated
# constant turns them into underscores), params may carry a decimal point, and
# upstream_commit is optional (it is checked when it is given). Nothing in the
# app downloads or loads these entries yet.
