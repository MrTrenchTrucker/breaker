# The pinned sherpa-onnx release file (an Android AAR) that this module compiles against.
# It is the ASR-only build of sherpa-onnx at upstream commit 11afbd00, with text-to-speech and
# speaker diarization switched off.
# Upstream: k2-fsa/sherpa-onnx, Apache License 2.0.
# read 2026-10-08 from https://github.com/MrTrenchTrucker/breaker/releases/tag/sherpa-onnx-asr-v1.13.8-r2
#
# This is the only file to edit when a different build of the same library replaces this
# release file: change the four keys below and nothing else.
#   version          the release number; it must equal the sherpa-onnx version in
#                    gradle/libs.versions.toml, and the build stops when the two differ.
#   sha256           the SHA-256 of the release file: exactly 64 lowercase hex digits, written
#                    on exactly one line. The build stops unless the downloaded file matches.
#   repositoryUrl    the address settings.gradle.kts downloads the file from.
#   artifactPattern  the path under that address; Gradle fills in [revision], [artifact], [ext].
version=1.13.8
sha256=5a9a7412d74e53fb4b2b24f7b3960b2dc6c402041ae2d386f98598abf29eff1a
repositoryUrl=https://github.com/MrTrenchTrucker/breaker/releases/download
artifactPattern=sherpa-onnx-asr-v[revision]-r2/[artifact]-v[revision]-asr-only.[ext]
